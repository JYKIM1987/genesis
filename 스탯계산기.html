<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>스탯 계산기</title>
<style>
  :root{
    --bg:#f4f1ea; --panel:#ffffff; --panel2:#f7f4ed; --border:#ddd5c2;
    --text:#3a3324; --text-dim:#8a8168; --accent:#a8791f; --accent-bg:#fdf3df;
  }
  * { box-sizing: border-box; }
  html, body{ height:100%; }
  body{
    background:var(--bg); color:var(--text); font-family:"Malgun Gothic","Pretendard",sans-serif;
    margin:0; padding:16px; line-height:1.45; font-size:13px;
    height:100vh;
  }
  /* 캐릭터별 계산기 페이지(.wrap{max-width:1180px})와 가로 폭을 맞춰서, 위쪽 캐릭터 선택 바와 아래 iframe 안 내용이 나란히 정렬되게 한다. */
  .wrap{ max-width:1180px; margin:0 auto; height:100%; display:flex; flex-direction:column; }
  h1{ font-size:18px; margin:0 0 12px; color:var(--accent); }
  /* 캐릭터가 늘어나며 여러 줄을 차지하던 picker를 한 줄 고정 + 좌우 스크롤로. ◀▶ 화살표로 스크롤, 오른쪽 끝 검색창으로 필터링. */
  .picker-bar{ display:flex; align-items:center; gap:6px; margin-bottom:12px; }
  .picker-arrow{
    background:var(--panel); color:var(--accent); border:1.5px solid var(--accent); border-radius:6px;
    padding:6px 10px; font-size:12px; font-weight:bold; cursor:pointer; flex:0 0 auto;
  }
  .picker-arrow:hover{ background:var(--accent-bg); }
  .picker-scroll{
    flex:1 1 auto; min-width:0; overflow-x:auto; overflow-y:hidden;
    scrollbar-width:none; -ms-overflow-style:none;
  }
  .picker-scroll::-webkit-scrollbar{ display:none; }
  .picker{ display:flex; align-items:center; gap:6px; flex-wrap:nowrap; }
  .picker button{
    background:var(--panel); color:var(--accent); border:1.5px solid var(--accent); border-radius:6px;
    padding:6px 8px 6px 12px; font-size:12.5px; font-weight:bold; cursor:pointer; white-space:nowrap; flex:0 0 auto;
    display:flex; align-items:center; gap:6px;
  }
  .picker button:hover{ background:var(--accent-bg); }
  .picker button.active{ background:var(--accent); color:#fff; }
  .picker button.hidden{ display:none; }
  /* 캐릭터 버튼 안쪽에 붙는 작은 개별 다운로드 아이콘 — 클릭 시 stopPropagation으로 캐릭터 선택과 분리. */
  .dl-icon{
    font-size:10px; font-weight:normal; opacity:0.6; padding:2px 4px; border-radius:4px; line-height:1;
  }
  .dl-icon:hover{ opacity:1; background:rgba(0,0,0,0.12); }
  /* 아우터원/이너브레이크 그룹 구분 — 세로줄 하나만, 별도 라벨 없이. */
  .picker .group-divider{ flex:0 0 auto; width:1px; align-self:stretch; background:var(--border); margin:2px 4px; }
  #pickerSearch{
    flex:0 0 140px; background:var(--panel2); color:var(--text); border:1px solid var(--border);
    border-radius:6px; padding:6px 8px; font-size:12.5px;
  }
  .bulk-bar{ display:flex; align-items:center; gap:8px; margin:0 0 12px; flex-wrap:wrap; }
  .bulk-bar button{
    background:var(--panel); color:var(--accent); border:1.5px solid var(--accent); border-radius:6px;
    padding:5px 10px; font-size:12px; font-weight:bold; cursor:pointer;
  }
  .bulk-bar button:hover{ background:var(--accent-bg); }
  .bulk-bar button:disabled{ opacity:0.5; cursor:default; }
  .bulk-hint{ color:var(--text-dim); font-size:11px; }
  .frame-wrap{ flex:1 1 auto; min-height:0; border:1px solid var(--border); border-radius:7px; overflow:hidden; background:var(--panel); }
  iframe{ width:100%; height:100%; border:0; display:block; }
  .empty{ display:flex; align-items:center; justify-content:center; height:100%; color:var(--text-dim); font-size:13px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body>
<div class="wrap">

<h1>스탯 계산기</h1>
<div class="picker-bar">
  <button class="picker-arrow" onclick="scrollPicker(-1)" title="왼쪽으로 스크롤">◀</button>
  <div class="picker-scroll" id="pickerScroll"><div class="picker" id="picker"></div></div>
  <button class="picker-arrow" onclick="scrollPicker(1)" title="오른쪽으로 스크롤">▶</button>
  <input type="text" id="pickerSearch" placeholder="캐릭터 검색" oninput="filterPicker(this.value)">
</div>
<div class="bulk-bar">
  <button id="bulkSaveBtn" onclick="downloadAllZip()">전체 일괄저장(ZIP)</button>
  <span class="bulk-hint">캐릭터 이름 옆 ⬇는 그 캐릭터만 파일로 저장, "전체 일괄저장"은 모든 캐릭터를 zip 하나로 저장합니다. 지금 저장돼 있는 설정(자동저장·저장 슬롯)도 함께 담겨서, 다운로드한 파일은 쿠키를 지워도 그대로 열립니다.</span>
</div>
<div class="frame-wrap" id="frameWrap"><div class="empty">캐릭터를 선택하세요</div></div>

</div>
<script>
// 아우터원 그룹 먼저 + 이너브레이크 그룹 뒤(CLAUDE.md 정의 — outerSkill 유무로 구분). 각 그룹 안에서는
// 최신 캐릭터가 맨 앞(왼쪽)에 오도록 나열한다 — 새 캐릭터는 소속 그룹 배열 맨 앞에 추가할 것
// (배열 전체의 맨 끝이 아니라 소속 그룹 블록의 맨 앞).
const OUTER_ONE_NAMES = ['철가면', '시라노', '하이델룬', '흑태자'];
const INNER_BREAK_NAMES = ['자비에르', '헬카이트', '아네모네', '알테어', '자드', '벨제부르', '프레데릭'];
// 가장 최근에 추가된 캐릭터 — 새 캐릭터를 추가할 때마다 이 값을 갱신할 것.
const LATEST_CHARACTER = '자비에르';
const OUT_DIR = 'char_html';
const LAST_KEY = 'genesisStatCalcLastChar';

function selectChar(name){
  localStorage.setItem(LAST_KEY, name);
  document.querySelectorAll('.picker button').forEach(b => b.classList.toggle('active', b.dataset.name===name));
  document.getElementById('frameWrap').innerHTML = `<iframe src="${OUT_DIR}/${encodeURIComponent(name)}.html" title="${name} 스탯 계산기"></iframe>`;
}

const picker = document.getElementById('picker');
const buttonsByName = {};
function addCharButton(name){
  const btn = document.createElement('button');
  btn.dataset.name = name;
  btn.dataset.missing = '0';
  btn.onclick = () => selectChar(name);

  const nameSpan = document.createElement('span');
  nameSpan.textContent = name;
  btn.appendChild(nameSpan);

  const dl = document.createElement('span');
  dl.className = 'dl-icon';
  dl.textContent = '⬇';
  dl.title = name + ' 파일로 저장(현재 설정 포함)';
  dl.onclick = (e) => { e.stopPropagation(); downloadSingle(name, dl); };
  btn.appendChild(dl);

  picker.appendChild(btn);
  buttonsByName[name] = btn;
}
OUTER_ONE_NAMES.forEach(addCharButton);
{
  const divider = document.createElement('div');
  divider.className = 'group-divider';
  picker.appendChild(divider);
}
INNER_BREAK_NAMES.forEach(addCharButton);

/* ================= 파일로 저장(다운로드) =================
   char_html/<이름>.html은 자기 localStorage(genesisStatCalcAutosave/genesisStatCalcSaves)에서
   저장된 빌드를 스스로 복원하므로, 다운로드할 사본에는 그 두 키에 현재 이 캐릭터의 값만 미리
   심어두는 <script>를 <body> 바로 뒤에 끼워 넣는다. 그러면 원본 파일의 로직은 한 글자도
   바꾸지 않고도, 사본을 열었을 때 캐릭터 자신의 loadAutosave()/불러오기가 이 값을 그대로
   읽어서 복원한다. 저장된 빌드가 하나도 없는 캐릭터는 원본 그대로(빈 상태) 내려받는다. */
const AUTOSAVE_KEY = 'genesisStatCalcAutosave';
const SAVE_KEY = 'genesisStatCalcSaves';

function buildEmbedSeedScript(name){
  let autosaveState = null, savedSlots = null;
  try { autosaveState = (JSON.parse(localStorage.getItem(AUTOSAVE_KEY)||'{}'))[name] || null; } catch(e){}
  try { savedSlots = (JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'))[name] || null; } catch(e){}
  if(!autosaveState && !savedSlots) return '';
  // 문자열 안에 스크립트 종료 태그가 그대로 나오면 바깥 스크립트가 조기 종료되므로 '<'를 이스케이프.
  const nameJson = JSON.stringify(name);
  const autoJson = JSON.stringify(autosaveState).replace(/</g, '\\u003c');
  const savesJson = JSON.stringify(savedSlots).replace(/</g, '\\u003c');
  return `<script>(function(){
  try{
    var name=${nameJson}, autoState=${autoJson}, saveState=${savesJson};
    if(autoState!==null){
      var a=JSON.parse(localStorage.getItem(${JSON.stringify(AUTOSAVE_KEY)})||'{}');
      a[name]=autoState; localStorage.setItem(${JSON.stringify(AUTOSAVE_KEY)}, JSON.stringify(a));
    }
    if(saveState!==null){
      var s=JSON.parse(localStorage.getItem(${JSON.stringify(SAVE_KEY)})||'{}');
      s[name]=saveState; localStorage.setItem(${JSON.stringify(SAVE_KEY)}, JSON.stringify(s));
    }
  }catch(e){}
})();<\/script>\n`;
}

async function buildDownloadHtml(name){
  const res = await fetch(`${OUT_DIR}/${encodeURIComponent(name)}.html`);
  if(!res.ok) throw new Error(`${name}.html을 불러오지 못했습니다`);
  const raw = await res.text();
  const seed = buildEmbedSeedScript(name);
  if(!seed) return raw;
  return raw.replace('<body>', '<body>\n' + seed);
}

function triggerFileDownload(filename, content, mime){
  const blob = new Blob([content], {type: mime});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

async function downloadSingle(name, iconEl){
  const orig = iconEl ? iconEl.textContent : null;
  try{
    if(iconEl){ iconEl.textContent = '...'; iconEl.style.pointerEvents = 'none'; }
    const html = await buildDownloadHtml(name);
    triggerFileDownload(`${name}.html`, html, 'text/html;charset=utf-8');
  } catch(e){
    alert('다운로드 실패: ' + e.message);
  } finally {
    if(iconEl){ iconEl.textContent = orig; iconEl.style.pointerEvents = ''; }
  }
}

async function downloadAllZip(){
  const names = Object.keys(buttonsByName).filter(n => buttonsByName[n].dataset.missing !== '1');
  if(names.length === 0) return;
  const btn = document.getElementById('bulkSaveBtn');
  const orig = btn.textContent;
  btn.disabled = true;
  try{
    const zip = new JSZip();
    // 로더 자신도 그대로 담아서, 압축을 풀었을 때 실제 사이트와 같은 폴더 구조(로더 + char_html/)로
    // 재현되게 한다 — 그래야 로더를 열었을 때 지금 사이트와 똑같이 동작한다.
    const selfHtml = await (await fetch(location.href)).text();
    const selfName = decodeURIComponent(location.pathname.split('/').pop()) || '스탯계산기.html';
    zip.file(selfName, selfHtml);
    for(const name of names){
      btn.textContent = `${name} 처리 중...`;
      zip.file(`${OUT_DIR}/${name}.html`, await buildDownloadHtml(name));
    }
    // 최신 equipment.js도 함께 담아, 압축 풀었을 때 각 파일 내장 폴백 대신 최신 장비 데이터를 쓰게 한다.
    try {
      const eqRes = await fetch(`${OUT_DIR}/equipment.js`);
      if(eqRes.ok) zip.file(`${OUT_DIR}/equipment.js`, await eqRes.text());
    } catch(e){ /* equipment.js가 없어도 각 파일 내장 폴백으로 동작하니 무시 */ }
    btn.textContent = 'ZIP 압축 중...';
    const blob = await zip.generateAsync({type:'blob'});
    triggerFileDownload('genesis_characters.zip', blob, 'application/zip');
  } catch(e){
    alert('일괄저장 실패: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.textContent = orig;
  }
}

function scrollPicker(dir){
  document.getElementById('pickerScroll').scrollBy({left: dir*220, behavior:'smooth'});
}
// 검색창에 입력한 문자열이 이름에 포함된 캐릭터만 남기고 나머지는 숨긴다.
// 파일이 없어서 숨겨진(dataset.missing) 버튼은 검색어를 지워도 다시 나타나지 않게 조건을 합친다.
function filterPicker(query){
  const q = query.trim();
  document.querySelectorAll('.picker button').forEach(b => {
    const missing = b.dataset.missing === '1';
    const filteredOut = !!q && !b.dataset.name.includes(q);
    b.classList.toggle('hidden', missing || filteredOut);
  });
}

// 목차 배열엔 있지만 실제 char_html/<이름>.html 파일이 없는 경우, 에러 없이 그 버튼만
// 조용히 숨긴다. file://로 여는 페이지는 fetch()로 파일 존재를 미리 확인할 수 없어서
// (브라우저가 로컬 fetch를 차단), 화면에 안 보이는 probe iframe을 실제로 띄워보고
// onload/onerror 신호만으로 판별한다. (이전엔 onload 후 contentDocument의 title/h1까지
// 읽어서 "내용이 비어 보이면 없는 것"으로 판단했는데, file://에서 이 문서 접근이
// 브라우저별로 막히거나 빈 문서로 보이는 경우가 있어 실제로 존재하는 파일도 "없음"으로
// 오판해 목록 전체가 나타났다 사라지는 원인이 됐다. 그래서 이제 onload=존재,
// onerror=없음이라는 브라우저의 로드 성공/실패 신호만 신뢰한다.) 이 검증은 어디까지나
// "있으면 그대로, 없으면 숨기기"만 하는 부가 기능이라, 캐릭터 로딩 자체(아래
// pickInitialAndSelect)는 이 결과를 기다리지 않고 항상 즉시 실행된다.
function verifyCharButtons(){
  const names = OUTER_ONE_NAMES.concat(INNER_BREAK_NAMES);
  names.forEach(name => {
    const probe = document.createElement('iframe');
    probe.style.display = 'none';
    let settled = false;
    const finish = (missing) => {
      if(settled) return;
      settled = true;
      // 지금 화면에 보여주고 있는(또는 마지막으로 저장된) 캐릭터는 이 판정 결과로 강제로
      // 바꾸지 않는다 — 여기서 재선택을 트리거하면 오탐 한 번에 사용자가 방금 고른/저장해둔
      // 선택이 조용히 다른 캐릭터로 튕겨나가 보일 수 있다(2026-09-09). 목차 버튼을 미리
      // 숨겨두는 것까지만 하고, 이미 표시 중인 화면은 건드리지 않는다 — 그 캐릭터를 다시
      // 고를 때만 이 hidden이 반영된다.
      if(missing){
        const btn = buttonsByName[name];
        if(btn){ btn.dataset.missing = '1'; btn.classList.add('hidden'); }
      }
      probe.remove();
    };
    probe.onload = () => finish(false);
    probe.onerror = () => finish(true);
    setTimeout(() => finish(false), 4000); // 안전망 — 정해진 시간 안에 로드/실패 신호가 없으면 판단 보류(숨기지 않음)
    probe.src = `${OUT_DIR}/${encodeURIComponent(name)}.html`;
    document.body.appendChild(probe);
  });
}
function pickInitialAndSelect(){
  const last = localStorage.getItem(LAST_KEY);
  const isVisible = n => buttonsByName[n] && !buttonsByName[n].classList.contains('hidden');
  const initial = isVisible(last) ? last
    : isVisible(LATEST_CHARACTER) ? LATEST_CHARACTER
    : Object.keys(buttonsByName).find(isVisible);
  if(initial) selectChar(initial);
  else document.getElementById('frameWrap').innerHTML = '<div class="empty">표시할 수 있는 캐릭터가 없습니다</div>';
}
pickInitialAndSelect();
verifyCharButtons();
</script>

</body>
</html>
