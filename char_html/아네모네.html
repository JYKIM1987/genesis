<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>아네모네 스탯 계산기</title>
<style>
  :root{
    --bg:#f4f1ea; --panel:#ffffff; --panel2:#f7f4ed; --border:#ddd5c2;
    --text:#3a3324; --text-dim:#8a8168; --accent:#a8791f; --accent-bg:#fdf3df;
    --village:#3a6ea8; --village-bg:#e8f0fa;
    --always:#3a8a5c; --always-bg:#e8f5ec;
    --cond:#b8622a; --cond-bg:#fbeee2;
    --skillonly:#7a3d99; --skillonly-bg:#f1e7f8;
    --statformula:#2f6f8f;
    --danger:#c0392b;
  }
  * { box-sizing: border-box; }
  html, body{ height:100%; }
  body{
    background:var(--bg); color:var(--text); font-family:"Malgun Gothic","Pretendard",sans-serif;
    margin:0; padding:16px; line-height:1.45; font-size:13px;
    height:100vh; overflow:hidden; display:flex; flex-direction:column;
  }
  /* 2026-07-23: 제목/설명(.sub)은 항상 고정, 왼쪽/오른쪽 탭이 각각 독립적으로 휠 스크롤되도록 재구성
     — 왼쪽 탭 휠을 굴려도 오른쪽 탭 내용이 밀리지 않고, 오른쪽 탭은 스크롤바를 숨기되 휠로는 계속 움직인다. */
  .wrap{ max-width:1180px; margin:0 auto; width:100%; flex:1 1 auto; min-height:0; display:flex; flex-direction:column; }
  h1{ font-size:18px; margin:0 0 4px; color:var(--accent); flex:0 0 auto; }
  .sub{ color:var(--text-dim); font-size:12px; margin-bottom:10px; flex:0 0 auto; }
  .maxbar{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .maxbar button{
    background:var(--panel); color:var(--accent); border:1.5px solid var(--accent); border-radius:6px;
    padding:8px 14px; font-size:12.5px; font-weight:bold; cursor:pointer;
  }
  .maxbar button:hover{ background:var(--accent-bg); }
  .maxbar button.active{ background:var(--accent); color:#fff; }
  .maxbar button.reset{ background:var(--panel2); color:var(--text-dim); border:1px solid var(--border); }
  .maxbar button.reset:hover{ color:var(--text); }
  .harness-note{
    background:var(--accent); color:#fff; border-radius:6px;
    padding:8px 10px; margin-bottom:6px; font-size:11.5px; line-height:1.5;
  }
  .harness-note .h-label{ font-size:10px; font-weight:900; text-transform:uppercase; letter-spacing:.04em; opacity:.9; display:block; margin-bottom:3px; }
  .harness-extra{ background:var(--panel2); border:1px solid var(--accent); border-radius:5px; padding:6px 8px; margin-bottom:6px; font-size:10.5px; color:var(--text); line-height:1.5; }
  .harness-extra b{ color:var(--accent); }
  .layout{ display:flex; gap:14px; align-items:stretch; flex:1 1 auto; min-height:0; }
  .col-left{
    flex:1 1 560px; min-width:0; display:grid; grid-template-columns:1fr 1fr; gap:10px; align-content:start;
    height:100%; overflow-y:auto; padding-right:6px;
  }
  .col-left .card.full{ grid-column: 1 / -1; }
  .col-right{ flex:0 0 380px; height:100%; }
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:7px;
    padding:10px 12px; min-width:0;
  }
  .card h2{ font-size:12.5px; margin:0 0 8px; color:var(--accent); display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .card h2 .tag{ font-size:9.5px; padding:1px 5px; border-radius:3px; background:var(--panel2); color:var(--text-dim); font-weight:normal; border:1px solid var(--border); }
  .row{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:5px 0; }
  select, input[type=number]{
    background:var(--panel2); color:var(--text); border:1px solid var(--border); border-radius:4px;
    padding:3px 5px; font-size:12px; max-width:100%;
  }
  label{ font-size:12px; }
  .opt-line, .choice-item{
    border-radius:5px; margin:3px 0; background:var(--panel2); padding:5px 7px;
  }
  .choice-item.sel, .opt-line.sel{ background:var(--accent-bg); border:1px solid var(--accent); }
  .choice-item.small{ padding:4px 6px; margin:2px 0; }
  .multi-col{ column-count:2; column-gap:10px; }
  .multi-col > .col-unit{ break-inside:avoid; -webkit-column-break-inside:avoid; }
  .opt-line.disabled{ opacity:.45; }
  .opt-top{ display:flex; align-items:center; gap:5px; flex-wrap:wrap; }
  .opt-top .name{ font-size:12px; flex:1 1 auto; min-width:0; }
  .opt-bottom{ display:flex; align-items:center; gap:5px; flex-wrap:wrap; margin-top:3px; font-size:11px; color:var(--text-dim); }
  .hl{ color:var(--accent); font-weight:bold; }
  .dim0{ color:var(--text-dim); font-weight:normal; }
  .badge{ font-size:9px; padding:1px 5px; border-radius:3px; font-weight:bold; white-space:nowrap; }
  .badge.village{ background:var(--village-bg); color:var(--village); }
  .badge.always{ background:var(--always-bg); color:var(--always); }
  .badge.cond{ background:var(--cond-bg); color:var(--cond); }
  .badge.skillonly{ background:var(--skillonly-bg); color:var(--skillonly); }
  /* 오른쪽 합계에 자동 합산되지 않는(스킬 발동 순간에만 적용) 수치 — 사용자가 직접 따로 고려해야 함을 시각적으로 도드라지게 표시 */
  .opt-bottom.skillonly-row{ background:var(--skillonly-bg); border:1px dashed var(--skillonly); border-radius:4px; padding:3px 6px; margin-top:3px; }
  .info-btn{
    background:var(--panel); border:1px solid var(--border); color:var(--text-dim); border-radius:50%;
    width:16px; height:16px; font-size:10px; cursor:pointer; line-height:1; padding:0; flex:0 0 auto;
  }
  .info-btn:hover{ color:var(--accent); border-color:var(--accent); }
  .info-btn-static{
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--panel); border:1px solid var(--border); color:var(--text-dim); border-radius:50%;
    width:1.6em; height:1.6em; font-size:inherit; line-height:1; padding:0; flex:0 0 auto; cursor:default;
  }
  .desc-box{
    display:none; background:var(--accent-bg); border:1px solid var(--border); border-radius:4px;
    padding:6px 8px; margin-top:4px; font-size:11px; color:var(--text); white-space:pre-line;
  }
  .desc-box.open{ display:block; }
  .slider-wrap{ display:flex; align-items:center; gap:4px; font-size:11px; color:var(--text-dim); }
  input[type=range]{ width:70px; accent-color:var(--accent); }
  .step-btn{
    background:var(--panel); border:1px solid var(--border); border-radius:3px; color:var(--accent);
    font-size:10px; font-weight:bold; width:16px; height:16px; line-height:1; padding:0; cursor:pointer; flex:0 0 auto;
  }
  .step-btn:hover{ background:var(--accent-bg); border-color:var(--accent); }
  .star-val{ min-width:16px; text-align:center; color:var(--accent); font-weight:bold; font-size:11px; }
  .star-val.stage-awaken{ color:var(--danger); }
  .note{ font-size:10px; color:var(--cond); }
  .checklimit{ font-size:11px; color:var(--text-dim); margin-bottom:5px; }
  .checklimit.over{ color:var(--danger); font-weight:bold; }
  .slot-col-title{ font-weight:bold; color:var(--accent); font-size:11px; margin-bottom:3px; }

  .results{
    background:var(--panel); border:1px solid var(--border); border-radius:7px; padding:12px 14px;
    height:100%; overflow-y:auto;
    scrollbar-width:thin; scrollbar-color:var(--border) transparent; /* 오른쪽 탭도 얇은 스크롤바로 표시(2026-07-23 재도입) */
  }
  .results::-webkit-scrollbar{ width:8px; }
  .results::-webkit-scrollbar-track{ background:transparent; }
  .results::-webkit-scrollbar-thumb{ background:var(--border); border-radius:4px; }
  .results::-webkit-scrollbar-thumb:hover{ background:var(--accent); }
  .results h2{ font-size:13px; margin:0 0 8px; color:var(--accent); }
  .results h3{ font-size:11px; margin:10px 0 4px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.03em; }
  table.result-table{ width:100%; border-collapse:collapse; font-size:11.5px; margin-bottom:6px; }
  table.result-table th, table.result-table td{
    padding:3px 3px; text-align:right; border-bottom:1px solid var(--border);
  }
  table.result-table th:first-child, table.result-table td:first-child{ text-align:left; }
  table.result-table th{ color:var(--text-dim); font-weight:normal; font-size:9.5px; }
  table.result-table td.total{ color:var(--accent); font-weight:bold; }
  table.result-table td.village{ color:var(--village); }
  table.result-table td.always{ color:var(--always); }
  table.result-table td.cond{ color:var(--cond); }
  table.result-table tr.hlrow td:first-child{ color:var(--accent); font-weight:bold; }
  .priority-box{
    background:var(--accent-bg); border:2px solid var(--accent); border-radius:8px;
    padding:8px 10px 4px; margin-bottom:12px;
  }
  .priority-box h3{ color:var(--accent); font-size:13px; text-transform:none; letter-spacing:0; margin:0 0 4px; font-weight:900; }
  table.priority-table{ font-size:13.5px; }
  table.priority-table th{ font-size:10.5px; }
  table.priority-table tr.hlrow td:first-child{ font-size:14px; }
  table.priority-table td.total{ font-size:16px; font-weight:900; }
  .critdmg-line{ font-size:11px; color:var(--text-dim); margin:4px 0 8px; padding:6px 8px; background:var(--panel2); border-radius:4px; }
  .critdmg-line b{ color:var(--accent); }
  .cond-list{ font-size:10.5px; color:var(--text-dim); margin-top:2px; }
  .cond-list li{ margin-bottom:2px; }
  .cond-list .clabel{ color:var(--cond); }
  .formula-note{
    font-size:10px; color:var(--text-dim); margin-top:10px; padding-top:8px;
    border-top:1px dashed var(--border);
  }
  /* AI 평가 — 합계 표 아래 고정 카드(정적 콘텐츠, 현재 빌드 선택과 무관). 구자료 마이그레이션 캐릭터 전용 유지. */
  .ai-eval{ margin-top:14px; padding-top:12px; border-top:2px solid var(--accent); }
  .ai-eval h3{ font-size:13px; color:var(--accent); margin:0 0 3px; text-transform:none; letter-spacing:0; }
  .ai-eval .ai-disclaimer{
    font-size:11px; font-weight:bold; color:var(--danger);
    background:var(--panel2); border:1px solid var(--danger); border-radius:5px;
    padding:5px 8px; margin-bottom:8px; display:flex; align-items:center; gap:5px;
  }
  .ai-eval .tagline{
    font-size:12px; font-weight:bold; color:var(--text); background:var(--accent-bg);
    border-radius:5px; padding:6px 9px; margin-bottom:10px;
  }
  .ai-eval .eval-block{ margin-bottom:9px; }
  .ai-eval .eval-block .label{
    font-size:10.5px; font-weight:900; color:var(--text-dim); text-transform:uppercase;
    letter-spacing:.03em; margin-bottom:4px;
  }
  .ai-eval ul{ margin:0; padding-left:0; list-style:none; font-size:11.5px; line-height:1.55; }
  .ai-eval li{ margin-bottom:4px; padding-left:1.1em; text-indent:-1.1em; }
  select[disabled]{ opacity:.4; }
  .save-slots{ display:grid; grid-template-columns:repeat(3,1fr); gap:6px; margin-top:8px; padding-top:8px; border-top:1px solid var(--border); }
  .save-slot{
    background:var(--panel2); border:1px solid var(--border); border-radius:5px;
    padding:6px; text-align:center; min-width:0;
  }
  .save-slot .slot-name{ font-size:11.5px; font-weight:bold; margin-bottom:4px; word-break:break-all; color:var(--text); }
  .save-slot .slot-empty{ font-size:11px; color:var(--text-dim); margin-bottom:4px; }
  .save-slot.active{ background:var(--accent); border-color:var(--accent); }
  .save-slot.active .slot-name{ color:#fff; }
  .mini-btn{
    background:var(--panel); border:1px solid var(--border); border-radius:4px;
    padding:3px 6px; font-size:10px; cursor:pointer; color:var(--text);
  }
  .mini-btn:hover{ border-color:var(--accent); color:var(--accent); }
  .mini-btn.danger:hover{ border-color:var(--danger); color:var(--danger); }
  @media (max-width: 980px){
    /* 좁은 화면에서는 독립 스크롤 2단 대신 기존처럼 페이지 전체가 한 번에 스크롤되는 단순 구조로 되돌린다. */
    body{ height:auto; overflow:visible; display:block; }
    .wrap{ height:auto; display:block; }
    h1, .sub{ flex:none; }
    .layout{ flex-direction:column; height:auto; }
    .col-left{ height:auto; overflow-y:visible; padding-right:0; grid-template-columns:1fr; }
    .col-right{ width:100%; height:auto; }
    .results{ height:auto; overflow-y:visible; }
  }
</style>
</head>
<body>
<div class="wrap">

<h1>아네모네 스탯 계산기</h1>
<div class="sub">모든 선택지가 항상 펼쳐져 있습니다. 항목 옆 흐린 글씨는 선택 시 합계에 더해지는 증감치(치명타확률·물리관통·마법관통은 강조색)이고, <span class="info-btn" style="display:inline-flex;align-items:center;justify-content:center;">?</span> 버튼으로 원문 설명을 볼 수 있어요.</div>

<div class="layout">
  <div class="col-left" id="left"></div>
  <div class="col-right">
    <div class="results" id="results"></div>
  </div>
</div>

</div>
<script>
/* ================= STAT META ================= */
// zone 값: 'village' | 'always'(인게임-상시) | 'cond'(인게임-조건부)
const BASE_STATS = ['hp','atk','mag','def','res'];
const OTHER_STATS = ['move','crit','critDmg','critResChance','critResDmg','phys','magPen','physRes','magRes'];
// 피해 감소/증가 계열 — 카테고리별로 따로 합산(광역 피해감소는 광역끼리, 지속피해감소는 지속끼리 등).
// 전체 분류를 미리 다 정해두지 않고, 캐릭터 raw_data에 실제로 등장하는 시점에 그때그때 키를 추가한다(STAT_LABEL에도 함께 추가할 것).
const DMG_STATS = ['dmgReduction','dotDmgReduction','dmgIncrease','dotDmgIncrease','bleedDmgIncrease','extraHitDmgIncrease','counterDmgIncrease','pincerDmgIncrease','aoeDmgReduction','aoeDmgIncrease','rangedDmgIncrease','skillDmgReduction','ultimateDmgReduction','ultimateDmgIncrease','basicAtkDmgIncrease','basicAtkDmgReduction','skillDmgIncrease','fixedDmgReduction','physDmgReduction','magDmgReduction','penDmgReduction','selfSkillDmgIncrease'];
// 회복(치유/보호막) 계열 — 캐릭터 kit은 원칙상(1장) 미추적이지만 룬은 healGive/healTake/shieldGive/shieldTake를 %로 제공해 추적 가능.
const HEAL_STATS = ['healGive','healTake','shieldGive','shieldTake'];
const ALL_STATS = [...BASE_STATS, ...OTHER_STATS, ...DMG_STATS, ...HEAL_STATS];
const PRIORITY_STATS = ['crit','phys','magPen'];
// 왼쪽 선택지 설명에서 강조 글꼴(.hl)을 적용할 스탯 — 치명/물관/마관 + 공격력/주문력.
const HL_STATS = ['crit','phys','magPen','atk','mag'];
// 결과(우측 탭) "★ 주요 스탯" 박스의 항목/순서를 그대로 결정(2026-07-23 재구성) — 최대 체력 → 공격력 → 주문력(기존
// 유지) → 치명타확률 → 받는 피해감소 → 물리관통/마법관통 중 이 캐릭터의 주 데미지 타입 하나만(이자벨 리피네는 전
// 스킬이 물리 고정 피해라 물리관통 채택) → 물리관통저항 → 마법관통저항. 다른 결과 표에서도 이 배열에 있는 스탯 행은
// 동일하게 굵게(.hlrow) 강조된다.
const HL_ROW_STATS = ['hp', 'atk', 'mag', 'crit', 'dmgReduction', 'phys', 'physRes', 'magRes'];
const STAT_LABEL = {
  hp:'최대 체력', atk:'공격력', mag:'주문력', def:'방어력', res:'저항력',
  move:'이동력', crit:'치명타확률', critDmg:'치명타 피해량',
  critResChance:'받는 치명타 확률 감소', critResDmg:'받는 치명타 피해량 감소',
  phys:'물리관통', magPen:'마법관통', physRes:'물리관통저항', magRes:'마법관통저항',
  dmgReduction:'받는 피해 감소', dotDmgReduction:'받는 지속 피해 감소',
  dmgIncrease:'주는 피해 증가', dotDmgIncrease:'주는 지속 피해 증가', bleedDmgIncrease:'주는 출혈 피해 증가',
  extraHitDmgIncrease:'주는 추가타 피해 증가', counterDmgIncrease:'주는 반격 피해 증가', pincerDmgIncrease:'주는 협공 피해 증가',
  aoeDmgReduction:'받는 광역 피해 감소', aoeDmgIncrease:'주는 광역 피해 증가', rangedDmgIncrease:'주는 원거리 공격 피해 증가',
  skillDmgReduction:'받는 스킬 피해 감소', ultimateDmgReduction:'받는 초필살기 피해 감소', ultimateDmgIncrease:'주는 초필살기 피해 증가',
  basicAtkDmgIncrease:'주는 기본공격 피해 증가', basicAtkDmgReduction:'받는 기본공격 피해 감소', skillDmgIncrease:'주는 스킬 피해 증가',
  fixedDmgReduction:'고정 피해 저항', physDmgReduction:'받는 물리 피해 감소', magDmgReduction:'받는 마법 피해 감소',
  penDmgReduction:'받는 관통 피해 감소',
  selfSkillDmgIncrease:'이 스킬 자체 피해 증가',
  healGive:'치유량 증가', healTake:'받는 치유량 증가', shieldGive:'주는 보호막 증가', shieldTake:'받는 보호막 증가'
};
// 치명타 피해량은 게임 시스템상 모든 캐릭터가 공통으로 갖는 기본값 150%(치명타 시 기본공격 대비 1.5배)가 있다 — 예전엔 "기본 150%"
// 특수 문장으로 별도 표시했으나, 이제 인게임 표기(치명타 피해량 150%)와 동일한 150을 모든 캐릭터의 치명타피해량 "마을" 버킷에
// 전역적으로 자동 가산해(computeTotals 참고) 다른 스탯과 동일한 마을/인게임/조건부/합계 표 형태로 자연스럽게 보이도록 통합했다
// (개별 캐릭터 데이터에는 손대지 않음, 2026-07-23 재확정 — 50이 아니라 150을 마을에 넣어야 인게임 표기와 혼선이 없음).
const CRIT_DMG_VILLAGE_BASE = 150;

/* ================= 무기 ================= */
const WEAPONS = {
  '락타 파르바티': {

/* ================= 캐릭터별 저장 세팅 (localStorage, 캐릭터당 3슬롯) ================= */
const SAVE_KEY = 'genesisStatCalcSaves';
function loadAllSaves(){
  try { return JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'); } catch(e){ return {}; }
}
function saveAllSaves(all){
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(all)); } catch(e){ alert('저장 실패: 브라우저 저장공간(localStorage)을 사용할 수 없습니다.'); }
}
function getCharSaves(charName){
  const all = loadAllSaves();
  const arr = (all[charName]||[]).slice(0,3);
  while(arr.length<3) arr.push(null);
  return arr;
}
function saveBuildToSlot(slotIdx){
  const charName = state.character;
  const arr = getCharSaves(charName);
  const existing = arr[slotIdx];
  const name = prompt('이 세팅의 이름을 입력하세요', existing ? existing.name : (charName+' 세팅 '+(slotIdx+1)));
  if(name===null) return; // 취소
  arr[slotIdx] = { name: name.trim() || ('세팅 '+(slotIdx+1)), state: JSON.parse(JSON.stringify(state)) };
  const all = loadAllSaves();
  all[charName] = arr;
  saveAllSaves(all);
  render();
}
function loadBuildFromSlot(slotIdx){
  const charName = state.character;
  const arr = getCharSaves(charName);
  const slot = arr[slotIdx];
  if(!slot) return;
  state = JSON.parse(JSON.stringify(slot.state));
  render();
}
function deleteBuildSlot(slotIdx){
  const charName = state.character;
  const arr = getCharSaves(charName);
  if(!arr[slotIdx]) return;
  if(!confirm(`"${arr[slotIdx].name}" 세팅을 삭제할까요?`)) return;
  arr[slotIdx] = null;
  const all = loadAllSaves();
  all[charName] = arr;
  saveAllSaves(all);
  render();
}

/* ================= 왼쪽 탭 선택 자동 저장(창을 닫았다 다시 열어도 유지) =================
   자체 localStorage에도 저장하지만(단독 실행 시 유일한 저장소), 로더 iframe으로 열린 경우엔 로더의
   top-level localStorage에도 같은 상태를 relay한다 — iframe(3rd-party 컨텍스트) 자체 localStorage는
   브라우저를 완전히 재시작하면 사라지는 경우가 있어(로더 자신의 저장은 안정적으로 남는 것과 대비),
   로더 쪽 저장을 진짜 저장소로 취급한다(초기 복원은 아래 genesisRestoreBuildState 핸들러가 담당). */
const AUTOSAVE_KEY = 'genesisStatCalcAutosave';
// 로더(부모)가 이 캐릭터의 저장된 빌드를 응답해줄 때까지는, 초기 렌더(기본값 또는 이 iframe 자신의
// localStorage에서 불러온 값)를 로더 쪽에 다시 저장하지 않는다 — 안 그러면 그 초기 렌더가 로더의
// 진짜 저장값을 기본값으로 덮어써버리고, 뒤이은 복원 응답이 그 방금 덮어써진(잘못된) 값을 그대로
// 돌려주는 경쟁 상태가 생겨 "브라우저를 껐다 켜면 항상 초기화"되는 원인이 된다.
function saveAutosave(){
  try {
    const all = JSON.parse(localStorage.getItem(AUTOSAVE_KEY)||'{}');
    all[state.character] = state;
    localStorage.setItem(AUTOSAVE_KEY, JSON.stringify(all));
  } catch(e){ /* 자동 저장 실패는 조용히 무시(수동 저장과 달리 매번 알릴 필요 없음) */ }
}
function loadAutosave(charName){
  try {
    const all = JSON.parse(localStorage.getItem(AUTOSAVE_KEY)||'{}');
    return all[charName] || null;
  } catch(e){ return null; }
}
// "저장된 세팅과 완전히 같은가"는 activeMaxMode/maxModeLocked(방금 MAX 버튼을 눌렀는지)와
// openDescLeft/openDescRight("?" 팝업이 열려있는지) 같은 화면 UI 상태는 빼고, 실제 빌드 선택만 비교한다.
function stateForCompare(s){
  const clone = JSON.parse(JSON.stringify(s));
  delete clone.activeMaxMode; delete clone.maxModeLocked;
  delete clone.openDescLeft; delete clone.openDescRight;
  return clone;
}
function matchesSavedSlot(slot){
  if(!slot) return false;
  return JSON.stringify(stateForCompare(state)) === JSON.stringify(stateForCompare(slot.state));
}

/* ================= HELPERS ================= */
function addEntry(bucket, statKey, entry, sourceLabel, condLog){
  if(!entry || !entry.v) return;
  const zone = entry.zone;
  bucket[zone][statKey] = (bucket[zone][statKey]||0) + entry.v;
  // 마을/상시/조건부 전부 "?" 세부내역에 출처를 남긴다 — 방어구 부위 개별 능력치처럼 마을 항목도 실제로 어디서 왔는지 확인 가능해야 함.
  if(condLog){
    // zone이 'always'인데 cond 필드가 남아있는 경우("공격 시"류 순수 트리거라 상시로 재분류했지만 원래 트리거 맥락은 보존한 항목,
    // 2026-07-23 규칙) — 라벨에 트리거를 괄호로 병기해 사용자가 왜 상시로 잡히는지 알 수 있게 한다.
    const label = (zone==='always' && entry.cond) ? `${sourceLabel} (${entry.cond})` : sourceLabel;
    condLog.push({label, stat:statKey, val:entry.v, zone, cond:entry.cond||''});
  }
}
function addStatObj(bucket, statObj, sourceLabel, condLog){
  if(!statObj) return;
  for(const k of ALL_STATS){
    if(statObj[k]) addEntry(bucket, k, statObj[k], sourceLabel, condLog);
  }
}
function statStrObj(statObj){
  if(!statObj) return '<span class="dim0">해당없음</span>';
  const rest = ALL_STATS.filter(k=>!PRIORITY_STATS.includes(k));
  const order = [...PRIORITY_STATS, ...rest];
  let parts = [];
  order.forEach(k=>{
    const e = statObj[k];
    if(e && e.v){
      const unit = k==='move' ? '' : '%';
      const cls = HL_STATS.includes(k) ? 'hl' : 'dim0';
      parts.push(`<span class="${cls}">${STAT_LABEL[k]} +${e.v}${unit}</span>`);
    }
  });
  return parts.length ? parts.join(', ') : '<span class="dim0">해당없음</span>';
}
// <option> 텍스트용 — HTML 태그 없이, 치명타/물리관통/마법관통만 우선 표시
function statPreviewPlain(statObj){
  if(!statObj) return '';

// <option> 텍스트용 — 우선순위 스탯만이 아니라 전체 스탯을 다 나열(세트효과처럼 항목 수가 적을 때 사용)
function statPreviewFull(statObj){

    const unit = k==='move' ? '' : '%';

function zoneBadge(zone){

  return '<span class="badge cond">인게임·조건부</span>';

function escapeHtml(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
// "?" 열림 상태를 DOM classList가 아니라 state에 저장(2026-07-23) — 다른 항목의 체크박스/슬라이더 조작으로
// render()가 다시 그려져도 이미 열려있던 "?"가 사라지지 않도록 함. 왼쪽/오른쪽 탭 각각 최대 1개까지만 열리고
// (같은 쪽에서 새 "?"를 열면 기존 것은 자동으로 닫힘), 좌우는 서로 무관하게 독립적으로 동작한다.
function descButton(key, text, side){
  side = side || 'left';
  const stKey = side==='left' ? 'openDescLeft' : 'openDescRight';
  const isOpen = state[stKey] === key;
  const safeKey = String(key).replace(/'/g,"\\'");
  return {btn:`<button class="info-btn" onclick="toggleDesc('${side}','${safeKey}')">?</button>`, box:`<div class="desc-box${isOpen?' open':''}">${escapeHtml(text)}</div>`};
}
function toggleDesc(side, key){
  const stKey = side==='left' ? 'openDescLeft' : 'openDescRight';
  state[stKey] = (state[stKey]===key) ? null : key;
  render();
}
// 저항/면역(왼쪽 탭 캐릭터 카드 상단 요약 줄의 "?" 상세) — 현재 선택(state)과 무관하게 캐릭터 kit 전체(클래스 전부/고유패시브/
// 오의/아우터스킬/액티브 전부/아티팩트 전부/전용무기)를 훑어 상태 저항·면역을 모은다. 클래스/액티브/아티팩트처럼
// "택1"이라 항상 보장되지 않는 출처는 전부 조건부(cond 배열)로, 고유패시브/오의/아우터스킬/무기처럼 캐릭터에게
// 항상 있는 출처는 고유(always 배열)로 분류한다. 각 항목엔 "왼쪽 탭 카테고리"(`category`)와, 클래스패시브/
// 액티브/아티팩트처럼 그 카테고리 안에 여러 선택 가능한 항목이 있는 경우엔 그 구체적 이름(`group` — 클래스
// id·액티브명·아티팩트명)도 함께 붙인다 — "?" 상세가 이 기준으로 다시 묶어서 보여주기 때문(buildResistDetail 참고).
// 각 블록의 `resist` 필드는 `{name}`(그 항목을 선택/사용/장착하면 바로 적용, 추가 조건 없음) 또는
// `{name, cond}`(선택/사용/장착만으로는 부족하고 cond에 적은 추가 조건까지 필요 — 액티브 스킬은 예외로
// 지속시간·범위 등 보충 설명으로 쓰임, 아래 buildResistDetail 참고) 형태의 배열이다.
const RESIST_CATEGORY_ORDER = ['고유패시브','오의','아우터스킬','전용무기','클래스패시브','아티팩트','액티브 스킬'];
function collectResistItems(c){
  const always = [];
  const cond = [];
  (c.classes||[]).forEach(cls => {
    (cls.resist||[]).forEach(r => cond.push({name:r.name, category:'클래스패시브', group:cls.id, cond:r.cond||null}));
  });
  if(c.uniquePassive && c.uniquePassive.resist){
    c.uniquePassive.resist.forEach(r => always.push({name:r.name, category:'고유패시브', cond:r.cond||null}));
  }
  if(c.ultimate && c.ultimate.resist){
    c.ultimate.resist.forEach(r => always.push({name:r.name, category:'오의', cond:r.cond||null}));
  }
  if(c.outerSkill && c.outerSkill.resist){
    c.outerSkill.resist.forEach(r => always.push({name:r.name, category:'아우터스킬', cond:r.cond||null}));
  }
  (c.actives||[]).forEach(a => {
    (a.resist||[]).forEach(r => cond.push({name:r.name, category:'액티브 스킬', group:a.name, cond:r.cond||null}));
  });
  (c.artifacts||[]).forEach(art => {
    (art.resist||[]).forEach(r => cond.push({name:r.name, category:'아티팩트', group:art.name, cond:r.cond||null}));
  });
  const wp = WEAPONS[c.weaponName];
  if(wp && wp.resist){
    wp.resist.forEach(r => always.push({name:r.name, category:'전용무기', cond:r.cond||null}));
  }
  return {always, cond};
}
// "?" 상세 텍스트 — "왼쪽 탭 카테고리"(RESIST_CATEGORY_ORDER 순서) 단위로 묶는다.
// 클래스패시브/아티팩트는 카테고리 안에 선택 가능한 항목이 여럿이라 `group`(클래스/아티팩트명)으로 한 번 더
// 나누고, 그 안에서 "상시"(cond 없음, 선택만으로 바로 적용)/"조건부"(cond 문구별로 합쳐서)를 나열한다.
// 액티브 스킬은 "사용 시"가 이미 트리거 자체라 상시/조건부 구분이 의미 없어, `group`(액티브명) 사용 시
// 항목을 바로 나열하고 cond가 있으면 지속시간/범위 같은 보충 설명을 괄호로 덧붙인다(조건별 병렬 표기).
function buildResistDetail(items){
  const byCat = {};
  items.forEach(it => { (byCat[it.category] = byCat[it.category]||[]).push(it); });
  const blocks = [];
  RESIST_CATEGORY_ORDER.forEach(cat => {
    const list = byCat[cat];
    if(!list || !list.length) return;
    let block = `[${cat}]`;
    if(cat === '액티브 스킬'){
      const byKey = {};
      list.forEach(i => {
        const key = i.group+'|||'+(i.cond||'');
        (byKey[key] = byKey[key] || {group:i.group, cond:i.cond, names:[]}).names.push(i.name);
      });
      Object.values(byKey).forEach(g => {
        block += `\n${g.group} 사용 시: ${g.names.join(', ')} 저항` + (g.cond ? ` (${g.cond})` : '');
      });
    } else if(list.some(i=>i.group)){
      const byGroup = {};
      list.forEach(i => { (byGroup[i.group] = byGroup[i.group]||[]).push(i); });
      Object.entries(byGroup).forEach(([groupName, groupItems]) => {
        block += `\n- ${groupName}`;
        const alwaysNames = groupItems.filter(i=>!i.cond).map(i=>i.name);
        if(alwaysNames.length) block += `\n  상시: ${alwaysNames.join(', ')}`;
        const byCond = {};
        groupItems.filter(i=>i.cond).forEach(i => { (byCond[i.cond] = byCond[i.cond]||[]).push(i.name); });
        Object.entries(byCond).forEach(([condText, names]) => { block += `\n  조건부(${condText}): ${names.join(', ')}`; });
      });
    } else {
      const alwaysNames = list.filter(i=>!i.cond).map(i=>i.name);
      if(alwaysNames.length) block += `\n상시: ${alwaysNames.join(', ')}`;
      const byCond = {};
      list.filter(i=>i.cond).forEach(i => { (byCond[i.cond] = byCond[i.cond]||[]).push(i.name); });
      Object.entries(byCond).forEach(([condText, names]) => { block += `\n조건부(${condText}): ${names.join(', ')}`; });
    }
    blocks.push(block);
  });
  return blocks.join('\n\n');
}
// 캐릭터 카드 상단(무게등급/무기 줄 바로 아래)에 넣는 압축 한 줄 요약 — 이름만 나열(그룹 내 중복 제거). "?"는 render()의 호출부에서 붙인다.
function resistSummaryLine(){
  const {always, cond} = collectResistItems(CHARACTERS[state.character]);
  if(!always.length && !cond.length) return '';
  const uniqNames = arr => [...new Set(arr.map(i=>i.name))].join(', ');
  const parts = [];
  if(always.length) parts.push('고유 저항 : ' + uniqNames(always));
  if(cond.length) parts.push('조건부 저항 : ' + uniqNames(cond));
  return parts.join(' / ');
}
// 행동추가(추가턴/재행동/추가이동/추가 공격·스킬) — 저항/면역과 완전히 동일한 원리(캐릭터 kit 전체를 훑어
// 종합, 방어구/악세사리/룬은 대상 아님)로 별도 4종 고정 카테고리를 추적한다. 저항(자유 명칭)과 달리 이 4개는
// 서로 다른 게임 메커닉이라 명확히 구분해야 한다 — 추가턴(스킬 쿨타임까지 감소하는 완전한 새 턴) vs
// 재행동(쿨타임은 그대로, 턴당 1회 제한 스킬도 그대로, 그냥 한 번 더 행동만 가능 — 인게임 "추가 행동" 툴팁
// 표현이 여기 해당) vs 추가이동(이동만) vs 추가 공격/스킬(공격 또는 스킬 사용만 한 번 더).
const EXTRA_ACTION_TYPES = ['추가턴','재행동','추가이동','추가 공격/스킬'];
function collectExtraActionItems(c){
  const items = [];
  (c.classes||[]).forEach(cls => {
    (cls.extraAction||[]).forEach(e => items.push({type:e.type, category:'클래스패시브', group:cls.id, cond:e.cond||null}));
  });
  if(c.uniquePassive && c.uniquePassive.extraAction){
    c.uniquePassive.extraAction.forEach(e => items.push({type:e.type, category:'고유패시브', cond:e.cond||null}));
  }
  if(c.ultimate && c.ultimate.extraAction){
    c.ultimate.extraAction.forEach(e => items.push({type:e.type, category:'오의', cond:e.cond||null}));
  }
  if(c.outerSkill && c.outerSkill.extraAction){
    c.outerSkill.extraAction.forEach(e => items.push({type:e.type, category:'아우터스킬', cond:e.cond||null}));
  }
  (c.actives||[]).forEach(a => {
    (a.extraAction||[]).forEach(e => items.push({type:e.type, category:'액티브 스킬', group:a.name, cond:e.cond||null}));
  });
  (c.artifacts||[]).forEach(art => {
    (art.extraAction||[]).forEach(e => items.push({type:e.type, category:'아티팩트', group:art.name, cond:e.cond||null}));
  });
  const wp = WEAPONS[c.weaponName];
  if(wp && wp.extraAction){
    wp.extraAction.forEach(e => items.push({type:e.type, category:'전용무기', cond:e.cond||null}));
  }
  return items;
}
// "?" 상세(왼쪽 탭) — 저항의 buildResistDetail과 달리 1차 그룹은 4가지 고정 카테고리(EXTRA_ACTION_TYPES 순서), 그
// 안에서 다시 출처(RESIST_CATEGORY_ORDER 순서)별로 나눠 조건을 나열한다.
function buildExtraActionDetail(items){
  const byType = {};
  items.forEach(it => { (byType[it.type] = byType[it.type]||[]).push(it); });
  const blocks = [];
  EXTRA_ACTION_TYPES.forEach(type => {
    const list = byType[type];
    if(!list || !list.length) return;
    let block = `[${type}]`;
    const byCat = {};
    list.forEach(it => { (byCat[it.category] = byCat[it.category]||[]).push(it); });
    RESIST_CATEGORY_ORDER.forEach(cat => {
      const catList = byCat[cat];
      if(!catList || !catList.length) return;
      catList.forEach(it => {
        const src = it.group ? `${cat} - ${it.group}` : cat;
        block += `\n- ${src}: ${it.cond || '조건 없이 상시'}`;
      });
    });
    blocks.push(block);
  });
  return blocks.join('\n\n');
}
// 왼쪽 탭용 압축 요약 — resistSummaryLine과 달리 그룹(고유/조건부) 구분 없이 "사용 가능한 카테고리 이름"만
// EXTRA_ACTION_TYPES 순서로 나열한다(어떤 출처인지는 옆의 "?"에서 확인).
function extraActionSummaryLine(){
  const items = collectExtraActionItems(CHARACTERS[state.character]);
  const names = EXTRA_ACTION_TYPES.filter(t => items.some(i=>i.type===t));
  if(!names.length) return '';
  return '행동 추가 기믹 : ' + names.join(', ');
}
// 슬라이더(성급/중첩/단계)를 마우스로 정밀 조작하기 어려운 문제 때문에 양옆에 ◀▶ 1스텝 버튼을 추가(2026-07-23).
function clampStep(val, delta, min, max){ return Math.max(min, Math.min(max, val+delta)); }
// 2026-07-24: 고유패시브 stack이 stages(각성/초 단계)에 따라 계수/최대치가 달라지는 캐릭터(리델 하트·이자벨·
// 알테어·프레데릭 등) 전용 — stages.options[idx].stack이 있으면 그 단계 전용 값을 쓰고, 없으면 기존처럼
// 고정값(up.stack.perStack이 top-level에 있는 경우, 예: 철가면)으로 폴백, 그마저 없으면(단계 자체에 아직
// 해금 안 된 스택) null(=이 단계에서는 스택 UI/효과 자체를 숨김).
function resolveStackCfg(up, stageIdx){
  if(!up.stack) return null;
  if(up.stages && stageIdx!=null){
    const opt = up.stages.options[stageIdx];
    if(opt && opt.stack) return opt.stack;
  }
  return up.stack.perStack ? up.stack : null;
}
// 2026-07-27: 고유패시브 toggle이 stages(각성/초 단계)에 따라 존재 여부/수치가 달라지는 캐릭터(프레데릭 등)
// 전용 — stages.options[idx].toggle이 있으면 그 단계 전용 값을 쓰고, 없으면 기존처럼 top-level up.toggle로
// 폴백(고정 토글, 예: 다른 캐릭터), 그마저 없으면(단계 자체에 아직 해금 안 된 토글) null.
function resolveToggleCfg(up, stageIdx){
  if(up.stages && stageIdx!=null){
    const opt = up.stages.options[stageIdx];
    if(opt && opt.toggle) return opt.toggle;
  }
  return up.toggle || null;
}
// toggle과 완전히 독립적인 두 번째 체크박스가 같은 단계에 필요할 때(예: "버프 보유" + "버프 보유 중 근접공격"처럼
// 서로 다른 조건의 별개 값). 자동 연동 없음 — 두 토글은 각자 켜고 끌 수 있다. stages.options[i].toggle2 전용,
// top-level 고정 toggle2는 아직 쓰임이 없어 지원하지 않는다(필요해지면 toggle과 동일하게 top-level 폴백 추가).
function resolveToggle2Cfg(up, stageIdx){
  if(up.stages && stageIdx!=null){
    const opt = up.stages.options[stageIdx];
    if(opt && opt.toggle2) return opt.toggle2;
  }
  return null;
}
// 고유패시브 radio가 stages(각성/초 단계)에 따라 존재 여부/선택지가 달라지는 캐릭터(철가면 "경계역전/경계고착" 등)
// 전용 — resolveToggleCfg와 동일한 우선순위(단계 전용 → top-level 고정값 → 없으면 null).
function resolveRadioCfg(up, stageIdx){
  if(up.stages && stageIdx!=null){
    const opt = up.stages.options[stageIdx];
    if(opt && opt.radio) return opt.radio;
  }
  return up.radio || null;
}
// 무기 레벨 stack의 중첩당 계수가 성급마다 다른 경우(예: 아수라 「검은 불꽃」, ★1 5%~★6 10%) wp.stack.perStackByStar[star]를
// 우선 쓰고, 없으면(성급 무관 고정 계수) wp.stack.perStack으로 폴백한다.
function resolveWeaponStackPerStat(wp, star){
  if(!wp.stack) return null;
  if(wp.stack.perStackByStar && wp.stack.perStackByStar[star]) return wp.stack.perStackByStar[star];
  return wp.stack.perStack || null;
}
// 무기 레벨 stack의 최대 중첩치가 성급마다 다른 경우(예: 알테어 「빅토리아의 영광」, ★1~5 3중첩~★6 4중첩)
// wp.stack.maxStackByStar[star]를 우선 쓰고, 없으면(성급 무관 고정 상한) wp.stack.maxStack으로 폴백한다.
function resolveWeaponStackMax(wp, star){
  if(!wp.stack) return 0;
  if(wp.stack.maxStackByStar && wp.stack.maxStackByStar[star]!=null) return wp.stack.maxStackByStar[star];
  return wp.stack.maxStack || 0;
}
// 단계를 바꿀 때 새 단계의 최대 중첩치보다 현재 중첩이 크면 잘라낸다(중첩 수 자체는 최대한 유지).
// 클래스 전환 시 그 클래스의 stack(있다면) 최대치로 세팅 — 8-1 원칙("디폴트는 항상 선택된 상태의 최대")을 클래스 전환에도 적용.
function onClassChange(id){
  state.classId = id;
  const cl = CHARACTERS[state.character].classes.find(c=>c.id===id);
  state.classStack = (cl && cl.stack) ? cl.stack.maxStack : 0;
  state.classStack2 = (cl && cl.stack2) ? cl.stack2.maxStack : 0;
  render();
}
function clampUniqueStackToStage(){
  const c = CHARACTERS[state.character];
  const up = c.uniquePassive;
  if(!up.stack) return;
  const stageIdx = up.stages ? (state.uniquePassiveStage ?? up.stages.default) : null;
  const cfg = resolveStackCfg(up, stageIdx);
  const max = cfg ? cfg.maxStack : 0;
  if(state.uniqueStack > max) state.uniqueStack = max;
}
// radio는 stack과 달리 "최대치 초과분만 자르는" 개념이 없다(옵션 개수가 보통 고정) — 새 단계에 radio 자체가
// 없어지면 null로, 새로 생기거나 인덱스가 범위를 벗어나면 0으로, 그 외(옵션 개수가 그대로인 흔한 경우)엔
// 사용자가 골라둔 인덱스를 그대로 유지한다(단계 전환마다 선택이 초기화되지 않도록).
function clampUniqueRadioToStage(){
  const c = CHARACTERS[state.character];
  const up = c.uniquePassive;
  const stageIdx = up.stages ? (state.uniquePassiveStage ?? up.stages.default) : null;
  const cfg = resolveRadioCfg(up, stageIdx);
  if(!cfg){ state.uniqueRadio = null; return; }
  if(state.uniqueRadio == null || state.uniqueRadio >= cfg.options.length) state.uniqueRadio = 0;
}

/* ================= 룬 계산 HELPERS ================= */
// 6슬롯(state.runeSlots)을 실제 스탯 목록으로 펼침: 슬롯별 개별효과 + 짝(2개)마다 중첩되는 세트효과.
// 반환 항목: {source, k, v, pct} — pct:true면 %가산, false면 5대 기본 스탯의 플랫(순수 수치) 가산.
function runeContributions(){
  const list = [];
  state.runeSlots.forEach((name, idx) => {
    if(name==='없음' || !RUNES[name]) return;
    const slot = idx+1;
    (RUNES[name].slots[slot]||[]).forEach(e => {
      list.push({source:`${slot}번 슬롯 - ${RUNES[name].name}`, k:e.k, v:e.v, pct:e.pct});
    });
  });
  const counts = {};
  state.runeSlots.forEach(name => { if(name!=='없음') counts[name]=(counts[name]||0)+1; });
  Object.entries(counts).forEach(([name,count]) => {
    const pairs = Math.floor(count/2);
    if(pairs<=0) return;
    RUNES[name].setEffect.forEach(e => {
      list.push({source:`세트효과 - ${RUNES[name].name}(${pairs}짝)`, k:e.k, v:e.v*pairs, pct:e.pct});
    });
  });
  return list;
}
// 계산기가 실제로 추적하는 14개 스탯 중 룬이 항상 %로만 주는 것들(=합계표에 바로 합산 가능한 것) 목록.
// hp/atk/mag/def/res는 룬에서 플랫(순수 수치) 값도 섞여 나와 %표와 단순합산이 불가능해서 제외하고 룬 패널에 별도 표기.
const RUNE_MERGEABLE_STATS = ['move','crit','critDmg','critResChance','critResDmg','phys','magPen','physRes','magRes'];
function bestRuneCombo(statKey){
  // statKey에 조금이라도 기여하는 룬(개별 슬롯값 or 세트효과)만 후보로 삼아 전수조사.
  const candidates = ['없음'];
  Object.keys(RUNES).forEach(name => {
    const r = RUNES[name];
    const touchesSlot = [1,2,3,4,5,6].some(s => (r.slots[s]||[]).some(e=>e.k===statKey && e.pct));
    const touchesSet = r.setEffect.some(e=>e.k===statKey && e.pct);
    if(touchesSlot || touchesSet) candidates.push(name);
  });
  let best = null, bestVal = -1;
  const combo = new Array(6).fill('없음');
  function evalCombo(){
    let total = 0;
    combo.forEach((name, idx) => {
      if(name==='없음') return;
      const slot = idx+1;
      (RUNES[name].slots[slot]||[]).forEach(e => { if(e.k===statKey && e.pct) total += e.v; });
    });
    const counts = {};
    combo.forEach(name => { if(name!=='없음') counts[name]=(counts[name]||0)+1; });
    Object.entries(counts).forEach(([name,count]) => {
      const pairs = Math.floor(count/2);
      if(pairs<=0) return;
      RUNES[name].setEffect.forEach(e => { if(e.k===statKey && e.pct) total += e.v*pairs; });
    });
    return total;
  }
  (function rec(i){
    if(i===6){ const v=evalCombo(); if(v>bestVal){ bestVal=v; best=combo.slice(); } return; }
    for(const name of candidates){ combo[i]=name; rec(i+1); }
  })(0);
  return {combo:best, val:bestVal};
}
// 현재 장착한 방어구(부위별 개별 능력치 + 2셋/4셋)에서 나오는 스탯만 골라 마을/상시/조건부별로 합산해 보여준다(룬 합산 결과와 동일한 패턴).
function renderArmorSummary(){
  const bucket = {village:{}, always:{}, cond:{}};
  ALL_STATS.forEach(k => { bucket.village[k]=0; bucket.always[k]=0; bucket.cond[k]=0; });
  const condLog = [];
  const setCounts = {};

function accessorySortOrder(name){
  const acc = ACCESSORIES[name];
  if(acc.unique) return 0;
  if(acc.tier==='상위') return 1;
  if(acc.grade==='영웅') return 3;
  return 2;
}
function sortedAccessoryNames(){
  return Object.keys(ACCESSORIES).sort((a,b)=>accessorySortOrder(a)-accessorySortOrder(b));
}
// 악세사리 설명(desc/skill.desc)에 박혀있는 성급 범위 표기를 현재 선택된 성급의 실제 값으로 치환한다(2026-07-24 신설).
// "?"를 열어둔 채 성급 슬라이더를 조작해도 설명 내용이 그 성급에 맞게 바뀌도록 하기 위함 — 단, 실제로
// statByStar(또는 starStats)에 기록된 값과 정확히 일치하는(검증된) 범위만 치환하고, "미추적"으로 표시된
// 회복량/확률/턴수 등은 성급별 정확한 값을 모르는 채로 추측해 채우지 않기 위해 원문 범위 그대로 남긴다.
function accessoryDescForStar(text, statByStar, star, maxStar){
  if(!text || !statByStar || !statByStar[1]) return text;
  const cur = statByStar[star] || statByStar[1];
  const signed = v => (v>=0?'+':'')+v;
  // 단순 범위: "+N%(★1)~+M%(★K)"
  text = text.replace(/(\+?)([\d.]+)%\(★1\)~\+?([\d.]+)%\(★\d+\)/g, (m, sign, n1, n2) => {
    const key = Object.keys(statByStar[1]).find(k => {
      const v1 = statByStar[1][k] && +statByStar[1][k].v;
      const vMax = statByStar[maxStar] && statByStar[maxStar][k] && +statByStar[maxStar][k].v;
      return v1===+n1 && vMax===+n2;
    });
    return (key && cur[key]) ? `${sign?signed(cur[key].v):cur[key].v}%` : m;
  });
  // 구간 버킷: "+N%(★A~B)/+M%(★C~D)/..." — 현재 성급이 속한 구간 값만 남긴다
  text = text.replace(/\+?[\d.]+%\(★\d+~\d+\)(?:\/\+?[\d.]+%\(★\d+~\d+\))+/g, (m) => {
    for(const p of m.split('/')){
      const mm = p.match(/(\+?)([\d.]+)%\(★(\d+)~(\d+)\)/);
      if(mm && star>=+mm[3] && star<=+mm[4]) return `${mm[1]}${mm[2]}%`;
    }
    return m;
  });
  return text;
}

}

  const wStat = state.weaponOn ? wp.starStats[state.weaponStar] : {};

  if(wp.stack){

    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;">

  html += `<div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border);">

  html += `<select style="width:100%;" onchange="onAccessoryChange(this.value)"><option value="없음" ${state.accessory==='없음'?'selected':''}>없음</option>`;

      const dtext = accessoryDescForStar(acc.skill.desc, acc.skill.statByStar, state.accessoryStar, acc.maxStar);
      html += optLine('스킬 효과 (자동으로 조건부 합산됨)', skillStat, 'cond', dtext);
    } else if(acc.desc && (/\(★\d/.test(acc.desc) || Object.values(stat).some(e=>e && e.zone==='cond'))){
      // skill 블록 없이 desc 자체에 성급별로 달라지는 조건부 효과가 있는 항목(예: 수호의 반지, 용 비늘 각반) —

  }
  html += `</div>`;
  html += `<div class="note" style="margin-top:6px;">같은 종류 룬이 2개(1짝)/4개(2짝)/6개(3짝) 모이면 세트효과가 짝 수만큼 중첩됩니다. 유일룬(검황/시간/계승/빛)은 슬롯 1~6번 각각 딱 1개까지만 보유 가능한 룬입니다.</div>`;
  html += `<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border);"><b>룬 효과 + 세트효과 합산 결과</b><div style="margin-top:4px;">${renderRuneSummary()}</div>`;

// 2026-07-23: 물리관통/마법관통 버튼을 "🎯 최대 관통 세팅" 하나로, 물리관통저항/마법관통저항도 "🛡 최대 관통 저항 세팅" 하나로 합침
// — state.activeMaxMode는 여전히 crit/phys/magPen/physRes/magRes 중 실제로 선택된 단일 키를 담고, 버튼은 그 키가 자기 그룹에 속하면 활성 표시한다.
const MAX_BTN_GROUPS = [
  {btnId:'maxBtn_crit', keys:['crit']},
  {btnId:'maxBtn_pen', keys:['phys','magPen']},
  {btnId:'maxBtn_penRes', keys:['physRes','magRes']}
];
function updateMaxBarUI(){
  // 2026-07-24: 값이 우연히 같은지가 아니라 activeMaxMode(=방금 클릭하고 그 뒤로 안 건드림)만으로 판정한다.
  MAX_BTN_GROUPS.forEach(g=>{
    const btn = document.getElementById(g.btnId);
    if(!btn) return;
    btn.classList.toggle('active', g.keys.includes(state.activeMaxMode));
  });
}

function onCharChange(name){ state.character = name; initState(); render(); }
function onActiveToggle(name, checked){ state.activesChecked[name] = checked; render(); }
function onArmorSetChange(slot, val){ state.armor[slot] = {set:val, star: val==='없음'?6:ARMOR_SETS[val].pieces[slot].maxStar}; render(); }
function onArmorFullSet(sname){
  SLOTS.forEach(slot => {
    if(sname==='없음'){ state.armor[slot] = {set:'없음', star:6}; }
    else { state.armor[slot] = {set:sname, star: ARMOR_SETS[sname].pieces[slot].maxStar}; }
  });
  render();
}
function onAccessoryChange(val){ state.accessory = val; state.accessoryStar = val==='없음'?1:(ACCESSORIES[val].maxStar||1); render(); }
function onRuneSlotChange(idx, val){ state.runeSlots[idx] = val; render(); }
function onArtifactChange(val){
  state.artifact = val;
  const c = CHARACTERS[state.character];
  const art = c.artifacts.find(a=>a.name===val);
  if(art){
    // 성급/중첩 슬라이더는 아티팩트를 바꿔도 사용자가 맞춰둔 값을 그대로 유지한다(다만 새 아티팩트의 범위를 넘으면 그 한도로 clamp).
    // fixedStar 아티팩트는 starStats에 고정 성급 키 하나만 존재하므로 항상 maxStar로 고정.
    state.artifactStar = art.fixedStar ? art.maxStar : Math.max(1, Math.min(state.artifactStar||art.maxStar, art.maxStar));
    state.artifactStack = art.stackable ? Math.max(0, Math.min(state.artifactStack||0, art.maxStack)) : 0;
  }
  render();
}

/* ================= MAX 세팅 (특정 스탯 최적화) ================= */
// weightClass를 반드시 넘겨서 이 캐릭터가 착용 가능한 방어구 안에서만 최적 조합을 찾는다(무게 등급이 다른 방어구는 애초에 착용 불가).
function bestArmorForStat(statKey, weightClass){
  const setNames = armorSetsFor(weightClass);
  const options = ['없음', ...setNames];
  let best = null, bestVal = -1;
  for(const s1 of options) for(const s2 of options) for(const s3 of options) for(const s4 of options){
    const combo = {투구:s1,갑옷:s2,장갑:s3,신발:s4};
    let total = 0;
    const stars = {};
    for(const slot of SLOTS){
      const sname = combo[slot];
      if(sname==='없음'){ stars[slot]=6; continue; }
      const p = ARMOR_SETS[sname].pieces[slot];
      stars[slot] = p.maxStar;
      if(p.pieceStat===statKey) total += (p.pieceStars[p.maxStar]||0);
    }
    const counts = {};
    for(const slot of SLOTS){ const sname=combo[slot]; if(sname!=='없음') counts[sname]=(counts[sname]||0)+1; }
    for(const [sname,count] of Object.entries(counts)){
      const s = ARMOR_SETS[sname];
      if(count>=2 && s.set2[statKey]) total += s.set2[statKey].v;
      if(count>=4 && s.set4[statKey]) total += s.set4[statKey].v;
    }
    if(total > bestVal){ bestVal = total; best = {combo, stars}; }
  }
  best.val = bestVal;
  return best;
}

// statKey를 최대화하는 선택지를 계산한다. baseState는 건드리지 않고(순수 함수),
// "이 스탯에 영향을 주는 항목만" 골라 바꾼 새 state 객체를 반환한다 — 무관한 선택은 baseState 그대로 유지.
// (MAX 버튼을 눌렀을 때 실제 적용은 물론, 현재 상태가 "진짜 최대"인지 비교하는 배너 음영 판정에도 그대로 재사용된다.)
function computeMaxSelections(statKey, baseState){
  const c = CHARACTERS[baseState.character];
  const s = JSON.parse(JSON.stringify(baseState));
  const fixed = FIXED_MAX_PRESET[statKey]; // crit/phys/magPen은 룬·방어구·악세사리를 실전 조합으로 고정

  // 룬
  if(fixed && fixed.runeMode === 'fixed'){
    s.runeSlots = fixed.runeFixed.slice();
  } else if(fixed && fixed.runeMode === 'preset'){
    s.runeSlots = RUNE_PRESETS[fixed.runePresetName].slice();
  } else if(fixed && fixed.runeMode === 'unchanged'){
    // 이 스탯엔 룬을 관여시키지 않음 — 현재 선택 그대로
  } else if(RUNE_MERGEABLE_STATS.includes(statKey)){
    const runeResult = bestRuneCombo(statKey);
    if(runeResult.val > 0) s.runeSlots = runeResult.combo;
  }

  // 클래스: 기여하는 클래스가 있을 때만 교체 (치명타는 클래스 고유 치명타확률도 함께 비교)
  // stack형 클래스패시브(예: 제로스위든 "무한의 적응")는 stat이 아니라 stack.perStack으로만 값을 주고,
  // toggle형 클래스패시브(예: 하이델룬 "L.T.K")는 stat이 아니라 toggle.stat으로만 값을 준다 —
  // 둘 다 각각의 최대 기여분(stack: perStack*maxStack, toggle: 켜졌을 때 값)까지 합쳐서 비교해야
  // 그 클래스가 최적으로 선택된다.
  let bestClass = null, bestClassVal = 0;
  c.classes.forEach(cl=>{
    let v=(cl.stat[statKey]&&cl.stat[statKey].v)||0;
    if(statKey==='crit') v += (cl.baseCrit||0);
    if(cl.stack && cl.stack.perStack[statKey]) v += cl.stack.perStack[statKey]*cl.stack.maxStack;
    if(cl.stack2 && cl.stack2.perStack[statKey]) v += cl.stack2.perStack[statKey]*cl.stack2.maxStack;
    if(cl.toggle && cl.toggle.stat[statKey]) v += cl.toggle.stat[statKey].v;
    if(v>bestClassVal){bestClassVal=v; bestClass=cl;}
  });
  if(bestClass) s.classId = bestClass.id;
  {
    const finalClass = c.classes.find(cl=>cl.id===s.classId);
    s.classStack = (finalClass && finalClass.stack) ? finalClass.stack.maxStack : 0;
    s.classStack2 = (finalClass && finalClass.stack2) ? finalClass.stack2.maxStack : 0;
    if(finalClass && finalClass.toggle && finalClass.toggle.stat[statKey]) s.classToggle = true;
  }

  // 고유패시브 radio(무작위 획득류, stages별로 존재 여부가 다를 수 있음 — 철가면 "경계역전/경계고착" 등)는
  // 최종 선택된 단계가 정해진 뒤에 그 단계 기준으로 고른다(radio는 MAX 버튼 5종의 대상 스탯이 아니므로 단계
  // 선택 자체에는 영향을 주지 않고, 정해진 단계 안에서만 이 statKey를 더 주는 옵션을 고른다).
  function pickBestRadioForStage(stageIdx){
    const rdCfg = resolveRadioCfg(c.uniquePassive, stageIdx);
    if(!rdCfg) return;
    let bestR = 0, bestRVal = -1;
    rdCfg.options.forEach((opt,idx)=>{
      const v = (opt.stat[statKey] && opt.stat[statKey].v) || 0;
      if(v > bestRVal){ bestRVal = v; bestR = idx; }
    });
    s.uniqueRadio = bestR;
  }
  // 고유패시브 단계 선택(2026-07-23, 리델 하트류 극소수만 해당) — 이 스탯을 가장 많이 주는 단계를 고른다.
  // 2026-07-24: stack의 계수/최대치가 단계마다 다른 캐릭터가 있어(예: 리델 하트 전투감각, 이자벨 강철관통),
  // 단계의 stat 값뿐 아니라 그 단계에서 얻는 중첩 기여분까지 합쳐서 "이 스탯을 가장 많이 주는 단계"를 고른다
  // (동률이면 더 나중/성숙한 단계를 우선 — 초필살기 단계 선택과 동일 원칙).
  if(c.uniquePassive.stages){
    let bestIdx = c.uniquePassive.stages.default, bestVal = -1;
    c.uniquePassive.stages.options.forEach((opt,idx)=>{
      const statV = (opt.stat[statKey] && opt.stat[statKey].v) || 0;
      const stCfg = resolveStackCfg(c.uniquePassive, idx);
      const stackContrib = (stCfg && stCfg.perStack[statKey]) ? stCfg.perStack[statKey]*stCfg.maxStack : 0;
      const tgCfg = resolveToggleCfg(c.uniquePassive, idx);
      const toggleContrib = (tgCfg && tgCfg.stat[statKey]) ? tgCfg.stat[statKey].v : 0;
      const tg2Cfg = resolveToggle2Cfg(c.uniquePassive, idx);
      const toggle2Contrib = (tg2Cfg && tg2Cfg.stat[statKey]) ? tg2Cfg.stat[statKey].v : 0;
      const total = statV + stackContrib + toggleContrib + toggle2Contrib;
      if(total >= bestVal){ bestVal = total; bestIdx = idx; }
    });
    s.uniquePassiveStage = bestIdx;
    if(c.uniquePassive.stack){
      const activeCfg = resolveStackCfg(c.uniquePassive, bestIdx);
      if(activeCfg && activeCfg.perStack[statKey]) s.uniqueStack = activeCfg.maxStack;
    }
    const activeToggleCfg = resolveToggleCfg(c.uniquePassive, bestIdx);
    if(activeToggleCfg && activeToggleCfg.stat[statKey]) s.uniqueToggle = true;
    const activeToggle2Cfg = resolveToggle2Cfg(c.uniquePassive, bestIdx);
    if(activeToggle2Cfg && activeToggle2Cfg.stat[statKey]) s.uniqueToggle2 = true;
    pickBestRadioForStage(bestIdx);
  } else {
    if(c.uniquePassive.stack && c.uniquePassive.stack.perStack[statKey]){
      s.uniqueStack = c.uniquePassive.stack.maxStack;
    }
    if(c.uniquePassive.toggle && c.uniquePassive.toggle.stat[statKey]){
      s.uniqueToggle = true;
    }
    pickBestRadioForStage(null);
  }
  // 초필살기 단계 선택(2026-07-23, 리델 하트류 극소수만 해당) — 항상 최종형(가장 강한 단계)을 고른다.
  if(c.ultimate.stages){
    let bestIdx = c.ultimate.stages.default, bestVal = -1;
    c.ultimate.stages.options.forEach((opt,idx)=>{
      const v = (opt.stat[statKey] && opt.stat[statKey].v) || 0;
      if(v >= bestVal){ bestVal = v; bestIdx = idx; }
    });
    s.ultimateStage = bestIdx;
  }
  if(c.outerSkill && c.outerSkill.stages){
    let bestIdx = c.outerSkill.stages.default, bestVal = -1;
    c.outerSkill.stages.options.forEach((opt,idx)=>{
      const v = (opt.stat[statKey] && opt.stat[statKey].v) || 0;
      if(v >= bestVal){ bestVal = v; bestIdx = idx; }
    });
    s.outerSkillStage = bestIdx;
  }

  // 아티팩트 — 기여하는 게 있을 때만 교체(없으면 현재 선택 유지, 강제로 "없음" 처리하지 않음)
  let bestArt = null, bestArtVal = 0, bestArtStar=4, bestArtStack=0;
  c.artifacts.forEach(a=>{
    let v=0, star=a.maxStar, stack=0;
    if(a.starStats){ const st=a.starStats[a.maxStar]||{}; v += (st[statKey]&&st[statKey].v)||0; }
    if(a.stackable){ const per=(a.starPerStack[a.maxStar]||{})[statKey]||0; if(per){ v += per*a.maxStack; stack=a.maxStack; } }
    if(v>bestArtVal){ bestArtVal=v; bestArt=a; bestArtStar=star; bestArtStack=stack; }
  });
  if(bestArt){ s.artifact=bestArt.name; s.artifactStar=bestArtStar; s.artifactStack=bestArtStack; }

  // 무기: 항상 장착, 최대 성급 (해가 되지 않음 — 유일하게 항상 손대는 항목)
  s.weaponOn = true; s.weaponStar = 6;
  { const wpm = WEAPONS[c.weaponName]; s.weaponStack = wpm.stack ? resolveWeaponStackMax(wpm, s.weaponStar) : 0; }

  // 방어구 — 고정 방어구가 이 캐릭터의 무게 등급과 맞지 않으면(착용 불가) 착용 가능한 세트 안에서 계산된 최적 조합으로 대체한다.
  const fixedArmorName = fixed ? resolveFixedByWeight(fixed.armorSet, c.weightClass) : null;
  if(fixedArmorName && armorWeightClass(fixedArmorName) === c.weightClass){
    const sname = fixedArmorName;
    SLOTS.forEach(slot=>{ s.armor[slot] = {set:sname, star: ARMOR_SETS[sname].pieces[slot].maxStar}; });
  } else {
    const armorResult = bestArmorForStat(statKey, c.weightClass);
    if(armorResult.val > 0){
      SLOTS.forEach(slot=>{
        const sname = armorResult.combo[slot];
        s.armor[slot] = {set:sname, star: sname==='없음'?6:armorResult.stars[slot]};
      });
    }
  }

  // 악세사리
  if(fixed && fixed.accessory === 'unchanged'){
    // 이 스탯엔 악세사리를 관여시키지 않음 — 현재 선택 그대로
  } else if(fixed && fixed.accessory){
    s.accessory = fixed.accessory;
    s.accessoryStar = ACCESSORIES[fixed.accessory].maxStar;
  } else {
    let bestAcc=null, bestAccVal=0, bestAccStar=1;
    Object.keys(ACCESSORIES).forEach(name=>{
      const acc = ACCESSORIES[name];
      const star = acc.maxStar;
      const st = acc.starStats[star]||{};
      let v = (st[statKey]&&st[statKey].v)||0;
      if(acc.extraAlways && acc.extraAlways[star] && acc.extraAlways[star][statKey]) v += acc.extraAlways[star][statKey];
      if(acc.skill){ const skillStat = acc.skill.statByStar[star]||acc.skill.statByStar[1]; if(skillStat[statKey] && skillStat[statKey].v) v += skillStat[statKey].v; }
      if(v>bestAccVal){ bestAccVal=v; bestAcc=name; bestAccStar=star; }
    });
    if(bestAcc){ s.accessory=bestAcc; s.accessoryStar=bestAccStar; }
    // 기여하는 악세사리가 없으면 현재 선택 유지(강제로 "없음" 처리하지 않음)
  }

  // 액티브 — 기여하는 것이 없으면 현재 체크 상태를 전혀 건드리지 않음.
  // 있으면 상위 기여 액티브를 반드시 포함시키되, 3칸 예산을 넘길 때만 무관한 액티브를 해제한다.
  const contributing = c.actives.filter(a=> a.stat && a.stat[statKey] && a.stat[statKey].v>0)
                                 .sort((a,b)=> b.stat[statKey].v - a.stat[statKey].v);
  if(contributing.length){
    const required = contributing.slice(0,3).map(a=>a.name);
    required.forEach(name => s.activesChecked[name] = true);
    let checkedNames = c.actives.filter(a=>s.activesChecked[a.name]).map(a=>a.name);
    while(checkedNames.length > 3){
      const removable = checkedNames.find(n => !required.includes(n)) || checkedNames.find(n => !required.slice(0, checkedNames.length-1).includes(n));
      if(!removable) break;
      s.activesChecked[removable] = false;
      checkedNames = checkedNames.filter(n=>n!==removable);
    }
  }

  return s;
}

function maxSetup(statKey){
  state = computeMaxSelections(statKey, state);
  state.activeMaxMode = statKey;
  state.maxModeLocked = true;
  render();
}

// 2026-07-23: 두 스탯(물리관통/마법관통, 또는 물리관통저항/마법관통저항) 중 이 캐릭터에게 더 높은 값을 주는 쪽 하나만 골라 세팅한다
// — 캐릭터는 늘 물리/마법 둘 중 하나로 갈리므로, 좌측 "최대 세팅" 메뉴에서는 항상 두 항목을 동시에 보여줄 필요가 없다는 취지.
// (우측 결과 탭에서는 물리관통/마법관통을 계속 분리해서 보여준다 — 이 함수는 좌측 버튼 메뉴 전용.)
function maxSetupBest(keyA, keyB){
  const savedState = state;
  const sA = computeMaxSelections(keyA, savedState);
  state = sA;
  const totA = computeTotals().bucket;
  const valA = totA.village[keyA] + totA.always[keyA] + totA.cond[keyA];

  state = savedState;
  const sB = computeMaxSelections(keyB, savedState);
  state = sB;
  const totB = computeTotals().bucket;
  const valB = totB.village[keyB] + totB.always[keyB] + totB.cond[keyB];

  if(valA >= valB){ state = sA; state.activeMaxMode = keyA; }
  else { state = sB; state.activeMaxMode = keyB; }
  state.maxModeLocked = true;
  render();
}

/* ================= CALC ================= */
function computeTotals(){
  const c = CHARACTERS[state.character];
  const bucket = {village:{}, always:{}, cond:{}};
  ALL_STATS.forEach(k => { bucket.village[k]=0; bucket.always[k]=0; bucket.cond[k]=0; });
  const condLog = [];

  // 치명타 피해량 기본값(2026-07-23 — 전 캐릭터 공통, 개별 캐릭터 데이터에는 넣지 않는다). CRIT_DMG_VILLAGE_BASE 선언부 주석 참고.
  addEntry(bucket, 'critDmg', {v:CRIT_DMG_VILLAGE_BASE, zone:'village'}, '치명타 피해량 기본값(전 캐릭터 공통)', condLog);

  const curClass = c.classes.find(cl=>cl.id===state.classId);
  addStatObj(bucket, curClass.stat, '클래스패시브 - '+curClass.id, condLog);
  if(curClass.baseCrit) addEntry(bucket, 'crit', {v:curClass.baseCrit, zone:'village'}, '클래스패시브 - '+curClass.id+' (클래스 고유 치명타확률)', condLog);
  if(curClass.toggle && state.classToggle) addStatObj(bucket, curClass.toggle.stat, '클래스패시브 - '+curClass.id+' ('+curClass.toggle.label+')', condLog);
  if(curClass.stack){
    for(const [k,per] of Object.entries(curClass.stack.perStack)){
      const total = per * (state.classStack||0);
      if(total) addEntry(bucket, k, {v:total, zone:'cond', cond:curClass.stack.cond}, '클래스패시브 - '+curClass.id+' ('+(curClass.stack.shortName||curClass.stack.label)+', '+state.classStack+'개)', condLog);
    }
  }
  if(curClass.stack2){
    for(const [k,per] of Object.entries(curClass.stack2.perStack)){
      const total = per * (state.classStack2||0);
      if(total) addEntry(bucket, k, {v:total, zone:'cond', cond:curClass.stack2.cond}, '클래스패시브 - '+curClass.id+' ('+(curClass.stack2.shortName||curClass.stack2.label)+', '+state.classStack2+'개)', condLog);
    }
  }

  if(c.uniquePassive.stages){
    const stg = c.uniquePassive.stages.options[state.uniquePassiveStage ?? c.uniquePassive.stages.default];
    addStatObj(bucket, stg.stat, '고유패시브 - '+c.uniquePassive.name+' ('+stg.name+')', condLog);
  } else {
    addStatObj(bucket, c.uniquePassive.base, '고유패시브 - '+c.uniquePassive.name+' (기본)', condLog);
  }
  if(c.uniquePassive.stack){
    const st = resolveStackCfg(c.uniquePassive, c.uniquePassive.stages ? (state.uniquePassiveStage ?? c.uniquePassive.stages.default) : null);
    if(st){
      for(const [k,per] of Object.entries(st.perStack)){
        const total = per * state.uniqueStack;
        if(total) addEntry(bucket, k, {v:total, zone:'cond', cond:st.cond||c.uniquePassive.stack.cond}, '고유패시브 - '+(st.shortName||c.uniquePassive.stack.shortName||c.uniquePassive.name)+' ('+state.uniqueStack+'중첩)', condLog);
      }
    }
  }
  if(state.uniqueToggle){
    const tg = resolveToggleCfg(c.uniquePassive, c.uniquePassive.stages ? (state.uniquePassiveStage ?? c.uniquePassive.stages.default) : null);
    if(tg) addStatObj(bucket, tg.stat, '고유패시브 - '+(tg.shortName||c.uniquePassive.name), condLog);
  }
  if(state.uniqueToggle2 && c.uniquePassive.stages){
    const tg2 = resolveToggle2Cfg(c.uniquePassive, state.uniquePassiveStage ?? c.uniquePassive.stages.default);
    if(tg2) addStatObj(bucket, tg2.stat, '고유패시브 - '+(tg2.shortName||c.uniquePassive.name), condLog);
  }
  {
    const rdCfg = resolveRadioCfg(c.uniquePassive, c.uniquePassive.stages ? (state.uniquePassiveStage ?? c.uniquePassive.stages.default) : null);
    if(rdCfg && state.uniqueRadio!=null){
      const opt = rdCfg.options[state.uniqueRadio];
      addStatObj(bucket, opt.stat, '고유패시브 - '+opt.name, condLog);
    }
  }

  if(c.ultimate.stages){
    const stg = c.ultimate.stages.options[state.ultimateStage ?? c.ultimate.stages.default];
    addStatObj(bucket, stg.stat, '초필살기 - '+c.ultimate.name+' ('+stg.name+')', condLog);
  } else {
    addStatObj(bucket, c.ultimate.stat, '초필살기 - '+c.ultimate.name, condLog);
  }
  if(c.outerSkill){
    if(c.outerSkill.stages){
      const stg = c.outerSkill.stages.options[state.outerSkillStage ?? c.outerSkill.stages.default];
      addStatObj(bucket, stg.stat, '아우터스킬 - '+c.outerSkill.name+' ('+stg.name+')', condLog);
    } else {
      addStatObj(bucket, c.outerSkill.stat, '아우터스킬 - '+c.outerSkill.name, condLog);
    }
  }

  c.actives.filter(a=>state.activesChecked[a.name]).slice(0,3).forEach(a => addStatObj(bucket, a.stat, '액티브 - '+a.name, condLog));

  if(state.artifact!=='없음'){
    const art = c.artifacts.find(a=>a.name===state.artifact);
    if(art.starStats) addStatObj(bucket, art.starStats[state.artifactStar]||{}, '아티팩트 - '+art.name, condLog);
    if(art.stackable){
      const perStat = art.starPerStack[state.artifactStar]||{};
      for(const k in perStat){
        const total = perStat[k]*state.artifactStack;
        if(total) addEntry(bucket, k, {v:total, zone:'cond', cond:art.cond}, '아티팩트 - '+art.name+' ('+state.artifactStack+'중첩)', condLog);
      }
    }
  }

  if(state.weaponOn){
    const wp = WEAPONS[c.weaponName];
    addStatObj(bucket, wp.starStats[state.weaponStar], '무기 - '+c.weaponName, condLog);
    if(wp.stack){
      const stackPer = resolveWeaponStackPerStat(wp, state.weaponStar);
      for(const k in stackPer){
        const total = stackPer[k]*state.weaponStack;
        if(total) addEntry(bucket, k, {v:total, zone:'cond', cond:wp.stack.cond}, '무기 - '+c.weaponName+' ('+(wp.stack.shortName||wp.stack.label)+', '+state.weaponStack+'개)', condLog);
      }
    }
  }
  if(state.forgeWeaponCrit) addEntry(bucket, 'crit', {v:state.forgeWeaponCrit, zone:'village'}, '무기 제련 (수동입력)', condLog);
  if(state.forgeWeaponPhys) addEntry(bucket, 'phys', {v:state.forgeWeaponPhys, zone:'village'}, '무기 제련 (수동입력)', condLog);
  if(state.forgeWeaponMagPen) addEntry(bucket, 'magPen', {v:state.forgeWeaponMagPen, zone:'village'}, '무기 제련 (수동입력)', condLog);
  if(state.forgeArmorCrit) addEntry(bucket, 'crit', {v:state.forgeArmorCrit, zone:'village'}, '장비 제련 (수동입력)', condLog);

  const setCounts = {};
  SLOTS.forEach(slot => { const s = state.armor[slot].set; if(s!=='없음') setCounts[s]=(setCounts[s]||0)+1; });
  Object.entries(setCounts).forEach(([sname,count]) => {
    const s = ARMOR_SETS[sname];
    if(count>=2) addStatObj(bucket, s.set2, '방어구 - '+s.name+' 2셋', condLog);
    if(count>=4) addStatObj(bucket, s.set4, '방어구 - '+s.name+' 4셋', condLog);
  });
  SLOTS.forEach(slot => {
    const cur = state.armor[slot]; if(cur.set==='없음') return;
    const pieceInfo = ARMOR_SETS[cur.set].pieces[slot];
    if(pieceInfo.pieceStat){
      const val = pieceInfo.pieceStars[cur.star]||0;
      if(val) addEntry(bucket, pieceInfo.pieceStat, {v:val, zone:'village'}, pieceInfo.name, condLog);
    }
  });

  if(state.accessory!=='없음'){
    const acc = ACCESSORIES[state.accessory];
    let stat = Object.assign({}, acc.starStats[state.accessoryStar]||acc.starStats[1]||{});
    if(acc.extraAlways && acc.extraAlways[state.accessoryStar]){
      for(const [k,v] of Object.entries(acc.extraAlways[state.accessoryStar])) stat[k]={v,zone:'village'};
    }
    addStatObj(bucket, stat, '악세사리 - '+acc.name, condLog);
    if(acc.skill){
      const skillStat = acc.skill.statByStar[state.accessoryStar]||acc.skill.statByStar[1];
      addStatObj(bucket, skillStat, '악세사리 - '+acc.name+' (스킬)', condLog);
    }
  }

  runeContributions().forEach(e => {
    // 룬 효과는 전부 zone:'village'다(조건 없는 상시 고정치). %값(pct:true)은 ALL_STATS 소속 키(BASE/OTHER/DMG/HEAL 전부)면
    // 오른쪽 합계에 그대로 병합된다 — 캐릭터 킷의 동일 계열 수치와 한 총합으로 합산됨(개별_정보 6장).
    if(e.pct && ALL_STATS.includes(e.k)) addEntry(bucket, e.k, {v:e.v, zone:'village'}, '룬 - '+e.source, condLog);
  });

  // 2026-07-23: 철가면의 "치확 100% 초과분 → 치피 전환"은 실제 인게임에서 상대 치확감/버프·디버프 상황에 따라
  // 달라지는 전투 중 계산이라, 결과 탭(마을/인게임/조건부 정적 합계)에서는 더 이상 자동 반영하지 않는다.
  // 왼쪽 패널의 고유패시브 설명(note)에서만 이 메커닉 자체를 서술한다.
  return {bucket, condLog};
}

function renderResults(){
  const c = CHARACTERS[state.character];
  const curClass = c.classes.find(cl=>cl.id===state.classId);
  const {bucket, condLog} = computeTotals();
  const legendBtn = descButton('legend', '마을: 전투 시작 전부터 조건 없이 적용되는 고정 능력치\n인게임: 완전히 조건 없이 발동되는 효과\n조건부: 발동에 특정 조건이 필요한 효과\n\n[예외] 아래 공격 관련 스탯은 "공격 시" 조건만 충족되면(다른 추가 조건 없이) 인게임으로 분류합니다 — 치명타확률, 치명타 피해량, 공격력, 주문력, 물리관통, 마법관통, 각종 주는 피해량', 'right');
  let html = `<h2>합계 ${legendBtn.btn}</h2>${legendBtn.box}`;
  // 이 캐릭터의 카테고리 목록 — "지금 선택한 옵션에 값이 있는지"가 아니라 "이 캐릭터가 어떤 선택을 하든
  // 나올 수 있는 카테고리인지"로 판정한다(클래스/아티팩트/액티브 등 선택을 바꿔도 행이 사라졌다 나타났다 하지 않도록).
  // 캐릭터 kit 자체(JSON 스캔)에 없더라도 현재 장착한 방어구/악세사리에서 실제로 값이 잡히면 그것도 포함시킨다
  // (예: 프레데릭 자신은 피해감소 계열이 있지만, 캐릭터 kit에 전혀 없는 캐릭터가 검은 깃발 같은 악세사리를 장착한 경우도 놓치지 않기 위함).
  const charJson = JSON.stringify(c);
  const dmgKeysUsed = DMG_STATS.filter(k => charJson.includes('"'+k+'"') || bucket.village[k] || bucket.always[k] || bucket.cond[k]);
  const healKeysUsed = HEAL_STATS.filter(k => charJson.includes('"'+k+'"') || bucket.village[k] || bucket.always[k] || bucket.cond[k]);

  function condDetailButton(statKey, section){
    const entries = condLog.filter(c => c.stat===statKey);
    const key = 'cond-'+section+'-'+statKey;
    const isOpen = state.openDescRight === key;
    const unit = statKey==='move' ? '' : '%';
    const villageEntries = entries.filter(e => e.zone==='village');
    const alwaysEntries = entries.filter(e => e.zone==='always');
    const condEntries = entries.filter(e => e.zone==='cond');
    const parts = [];
    if(villageEntries.length){
      parts.push('[마을]\n' + villageEntries.map(e => `${e.label}: +${e.val}${unit}`).join('\n'));
    }
    if(alwaysEntries.length){
      parts.push('[인게임]\n' + alwaysEntries.map(e => `${e.label}: +${e.val}${unit}`).join('\n'));
    }
    // 스킬 한정(합산 안 됨) 소스 — actives[].skillStat은 bucket/condLog에 없으므로 여기서 별도로 수집한다.
    // 오른쪽 합계에 새지 않는 값이라는 걸 놓치지 않도록, [조건부] 파트 안에 보라색 굵은 글씨 태그를 붙여 구분해서 보여준다.
    const skillOnlyEntries = [];
    c.actives.forEach(a => {
      if(a.skillStat && a.skillStat[statKey] && a.skillStat[statKey].v){
        skillOnlyEntries.push({label:'액티브 - '+a.name, val:a.skillStat[statKey].v, cond:`"${a.name}" 사용 시`});
      }
      if(a.stack && a.stack.perStack[statKey]){
        const cur = state.activeStackByName[a.name] || 0;
        const val = a.stack.perStack[statKey] * cur;
        if(val){
          skillOnlyEntries.push({label:'액티브 - '+a.name+' ('+(a.stack.shortName||a.stack.label)+', '+cur+'개)', val, cond:`"${a.name}" 사용 시`});
        }
      }
    });
    // 참고용 서술(합산 불가) — 고유패시브 stages.options[i].refNote(또는 uniquePassive.refNote)에 이 statKey를
    // 겨냥한 참고 정보가 있으면 여기 노출한다. 값을 스탯으로 환산할 수 없거나(예: "적의 받는 피해 감소를 무시"처럼
    // 피해 증가와는 성격이 다른 효과) 애매해서 합산 대상으로 넣지 않기로 한 항목을 사용자가 놓치지 않게 하기 위함
    // (철가면 "빛의 인도자" 최초 적용 예 — "받는 피해 감소 무시"를 dmgIncrease 합산엔 넣지 않되 "?"에서는 보이게 함).
    const refNoteEntries = [];
    {
      const upStageIdx = c.uniquePassive.stages ? (state.uniquePassiveStage ?? c.uniquePassive.stages.default) : null;
      const upOpt = (c.uniquePassive.stages && upStageIdx!=null) ? c.uniquePassive.stages.options[upStageIdx] : null;
      const rn = (upOpt && upOpt.refNote) || c.uniquePassive.refNote;
      if(rn && rn.statKey===statKey) refNoteEntries.push(rn);
    }
    // 스탯 공식 기반(다른 스탯의 %로 계산되는 동적 값) 효과 — 어떤 스탯인지는 명확하지만 실시간 스탯 변동을 반영한
    // 정적 계산이 불가능해 합산에서 제외된 항목. classes[].statFormulaNote / uniquePassive(.stages[i]).statFormulaNote /
    // ARMOR_SETS[].set2StatFormulaNote·set4StatFormulaNote에 채워두면 여기서 자동으로 노출된다.
    const statFormulaEntries = [];
    {
      if(curClass.statFormulaNote && curClass.statFormulaNote.statKey===statKey) statFormulaEntries.push(curClass.statFormulaNote);
      const upStageIdx2 = c.uniquePassive.stages ? (state.uniquePassiveStage ?? c.uniquePassive.stages.default) : null;
      const upOpt2 = (c.uniquePassive.stages && upStageIdx2!=null) ? c.uniquePassive.stages.options[upStageIdx2] : null;
      const sfn = (upOpt2 && upOpt2.statFormulaNote) || c.uniquePassive.statFormulaNote;
      if(sfn && sfn.statKey===statKey) statFormulaEntries.push(sfn);
      const setCounts = {};
      SLOTS.forEach(slot => { const s = state.armor[slot].set; if(s!=='없음') setCounts[s]=(setCounts[s]||0)+1; });
      Object.entries(setCounts).forEach(([sname,count]) => {
        const s = ARMOR_SETS[sname];
        if(count>=2 && s.set2StatFormulaNote && s.set2StatFormulaNote.statKey===statKey) statFormulaEntries.push(s.set2StatFormulaNote);
        if(count>=4 && s.set4StatFormulaNote && s.set4StatFormulaNote.statKey===statKey) statFormulaEntries.push(s.set4StatFormulaNote);
      });
    }
    if(condEntries.length || skillOnlyEntries.length || refNoteEntries.length || statFormulaEntries.length){
      let condBlock = '[조건부]';
      if(condEntries.length) condBlock += '\n' + condEntries.map(e => `${e.label}: +${e.val}${unit}\n   → 조건: ${e.cond||'(조건 정보 없음)'}`).join('\n\n');
      if(skillOnlyEntries.length) condBlock += (condEntries.length?'\n\n':'\n') + skillOnlyEntries.map(e => `__SKILLONLY_TAG__ ${e.label}: +${e.val}${unit}\n   → 조건: ${e.cond}`).join('\n\n');
      if(refNoteEntries.length) condBlock += (condEntries.length||skillOnlyEntries.length?'\n\n':'\n') + refNoteEntries.map(e => `__REFNOTE_TAG__ ${e.label}: ${e.text}`).join('\n\n');
      if(statFormulaEntries.length) condBlock += (condEntries.length||skillOnlyEntries.length||refNoteEntries.length?'\n\n':'\n') + statFormulaEntries.map(e => `__STATFORMULA_TAG__ ${e.label}: ${e.text}`).join('\n\n');
      parts.push(condBlock);
    }
    if(BASE_STATS.includes(statKey)){
      const flatRune = runeContributions().filter(e => e.k===statKey && !e.pct);
      if(flatRune.length){
        parts.push('[룬 고정 수치 — %표에는 합산되지 않음, 마을 기본 스탯에 직접 더해서 판단]\n' + flatRune.map(e => `${e.source}: +${e.v}`).join('\n'));
      }
    }
    const text = parts.length ? parts.join('\n\n') : '현재 이 스탯에 마을/상시/조건부로 반영된 항목이 없습니다.';
    // __SKILLONLY_TAG__는 escapeHtml 이후에 실제 강조 태그로 치환한다(다른 동적 텍스트는 그대로 이스케이프해 안전하게 유지).
    const safeText = escapeHtml(text)
      .replace(/__SKILLONLY_TAG__/g, '<b style="color:var(--skillonly);">(스킬한정·합산안됨)</b>')
      .replace(/__REFNOTE_TAG__/g, '<b style="color:var(--text-dim);">(참고용·합산안됨)</b>')
      .replace(/__STATFORMULA_TAG__/g, '<b style="color:var(--statformula);">(스탯기반·합산안됨)</b>');
    return {btn:`<button class="info-btn" onclick="toggleDesc('right','${key}')">?</button>`, box:`<div class="desc-box${isOpen?' open':''}">${safeText}</div>`};
  }

  function tableFor(keys, title, priority, noTotal){
    const tblCls = priority ? 'result-table priority-table' : 'result-table';
    const totalTh = noTotal ? '' : '<th>합계</th>';
    let h = `<h3>${title}</h3><table class="${tblCls}"><thead><tr><th>스탯</th><th>마을</th><th>인게임</th><th>조건부</th>${totalTh}<th></th></tr></thead><tbody>`;
    let boxes = '';
    keys.forEach(k => {
      const v=bucket.village[k], a=bucket.always[k], cd=bucket.cond[k], tot=v+a+cd;
      const unit = k==='move' ? '' : '%';
      const rowCls = HL_ROW_STATS.includes(k) ? 'hlrow' : '';
      const cb = condDetailButton(k, priority ? 'priority' : 'full');
      const totalTd = noTotal ? '' : `<td class="total">${tot.toFixed(1)}${unit}</td>`;
      h += `<tr class="${rowCls}"><td>${STAT_LABEL[k]}</td><td class="village">${v.toFixed(1)}${unit}</td><td class="always">${a.toFixed(1)}${unit}</td><td class="cond">${cd.toFixed(1)}${unit}</td>${totalTd}<td>${cb.btn}</td></tr>`;
      boxes += cb.box;
    });
    h += `</tbody></table>` + boxes;
    return priority ? `<div class="priority-box">${h}</div>` : h;
  }

  // 2026-07-23 재조정: 박스화는 "주요 스탯"(HL_ROW_STATS 7개) 하나에만 적용하고, 그 아래 전체 목록은
  // 최초 버전대로 박스 없이 나열(주요 스탯은 아래 목록에도 중복 표기됨 — 의도된 것).
  html += tableFor(HL_ROW_STATS, '★ 주요 스탯', true);

  html += tableFor([...BASE_STATS,'move'], '기본 스탯', false, true);

  html += tableFor(['crit','critDmg','critResChance','critResDmg'], '치명타', false);

  html += tableFor(['phys','magPen','physRes','magRes'], '관통', false);

  if(dmgKeysUsed.length){
    html += tableFor(dmgKeysUsed, '피해 감소 / 피해 증가 (계열별 합산)', false);
  }

  if(healKeysUsed.length){
    html += tableFor(healKeysUsed, '회복 (치유 · 보호막)', false);
  }

  html += `<div class="formula-note">합계 = 마을 + 인게임 + 조건부 단순 합산.<br>각 행 맨 오른쪽 <b>?</b>를 누르면 그 스탯에 잡힌 마을·인게임·조건부 항목 출처(어디서 얼마나 왔는지, 조건부는 조건까지)가 나옵니다. 선택지 자체의 조건 설명은 왼쪽 패널의 각 항목 <b>?</b>에서 확인하세요.<br>상단 MAX 버튼은 해당 스탯에 기여하는 선택지만 자동으로 골라주고, 관련 없는 항목은 "없음"으로 정리합니다.</div>`;

  html += renderAIEval();

  document.getElementById('results').innerHTML = html;
}

render();

// equipment.js가 이 파일과 같은 폴더에 있으면 그 내용을 우선 적용하고, 없으면(또는 로드 실패)
// 위에 내장된 폴백 사본을 그대로 쓴다. equipment.js는 window.EQUIPMENT_OVERRIDE에 코드 키(ARM01/
// ACC01/RUNE01...) 스키마로 데이터를 담아 노출한다(장비_룬_악세사리_raw_data.md 0-1/0-2장 참고) —
// 이 폴백 사본도 반드시 같은 코드 키 스키마여야 한다(다르면 폴백/외부 적용 시 state에 저장되는 값의
// 형태가 달라져 저장된 빌드 선택이 깨진다).
(function(){
  const s = document.createElement('script');
  s.src = 'equipment.js';
  s.onload = () => {
    const ov = window.EQUIPMENT_OVERRIDE;
    if(!ov) return;
    Object.keys(EQUIP_DATASETS).forEach(key => {
      const fresh = ov[key];
      if(!fresh) return;
      const target = EQUIP_DATASETS[key];
      Object.keys(target).forEach(k => delete target[k]);
      Object.assign(target, fresh);
    });
    if(ov.SLOTS){ SLOTS.length = 0; SLOTS.push(...ov.SLOTS); }
    if(ov.RUNE_GRADE_ORDER){ RUNE_GRADE_ORDER.length = 0; RUNE_GRADE_ORDER.push(...ov.RUNE_GRADE_ORDER); }
    render();
  };
  s.onerror = () => { /* equipment.js 없음 — 내장 폴백 그대로 사용 */ };
  document.head.appendChild(s);
})();
</script>
</body>
</html>
